<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Series 7 — sign in</title>
<style>
  :root { --ink:#1a2233; --muted:#6b7688; --line:#e6e9ef; --bg:#f7f8fa; --card:#fff; --accent:#2f6df6; --done:#1a9e6b; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg);
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  main { width:100%; max-width:420px; padding:24px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 22px; font-size:14px; }
  .resume { display:block; text-decoration:none; background:var(--accent); color:#fff; border-radius:12px; padding:14px 16px;
            font-weight:600; margin-bottom:18px; }
  .resume small { display:block; font-weight:400; opacity:.85; font-size:12px; margin-top:2px; }
  .divider { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin:0 0 10px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  a.name { text-decoration:none; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:18px 12px; color:var(--ink); font-weight:600; font-size:17px; transition:border-color .15s, transform .05s; }
  a.name:hover { border-color:var(--accent); }
  a.name:active { transform:scale(.98); }
  .foot { color:var(--muted); font-size:12px; margin-top:22px; text-align:center; }
  .foot a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Series 7 study tracker</h1>
  <p class="sub">Pick your name to jump back into your plan.</p>
  <div id="resume"></div>
  <p class="divider" id="pick-label">Who's studying?</p>
  <div class="grid" id="names"></div>
  <p class="foot">Not started yet? Take the <a href="./index.html">baseline diagnostic</a> first.</p>
</main>
<script>
// Display roster — slugs must match the backend STUDENTS var and the /students plans.
const ROSTER = [["sydni","Sydni"],["jojo","Jojo"],["jonah","Jonah"],["adam","Adam"]];
const LAST = localStorage.getItem("s7student");

function go(slug) { localStorage.setItem("s7student", slug); location.href = "./progress.html?s=" + slug; }

// one-tap resume for whoever used this device last
if (LAST) {
  const name = (ROSTER.find(([s]) => s === LAST) || [LAST, LAST])[1];
  const a = document.createElement("a");
  a.className = "resume"; a.href = "./progress.html?s=" + LAST;
  a.onclick = () => localStorage.setItem("s7student", LAST);
  a.innerHTML = "Continue as " + name + "<small>tap to pick up where you left off</small>";
  document.getElementById("resume").append(a);
  document.getElementById("pick-label").textContent = "Or switch student";
}

const grid = document.getElementById("names");
ROSTER.forEach(([slug, name]) => {
  const a = document.createElement("a");
  a.className = "name"; a.href = "./progress.html?s=" + slug; a.textContent = name;
  a.onclick = (e) => { e.preventDefault(); go(slug); };
  grid.append(a);
});
</script>
</body>
</html>
