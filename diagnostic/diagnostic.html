 at 40 STOP. After the order is entered the tape shows: 40.25, 40.10, 40.00, 39.85, 39.95. At what price is the order executed?", "options": ["40.00", "39.85", "39.95", "40.10"], "answer": 1, "explanation": "A sell stop is elected by the first trade at or below the stop price (40.00) and then becomes a market order filled at the NEXT print, 39.85. Election and execution are two different trades.", "calc": true, "source": "09-regulation-trading-economics.md §3.8 Ticker-tape worked example"}, {"id": "reg-L3-04", "domain": "regulation", "level": 3, "topic": "settlement-date-across-weekend", "module": "M38", "stem": "A customer buys 200 shares of an NYSE-listed stock regular way on a Friday. No market holidays fall in the following week. On what day does the trade settle?", "options": ["The following Monday", "That same Friday", "The following Tuesday", "The following Wednesday"], "answer": 0, "explanation": "Regular way is T+1 business day (since May 28, 2024), and weekends are not business days, so a Friday trade settles Monday. Reg T payment would be due on Wednesday (settlement plus two business days, T+3).", "calc": true, "source": "09-regulation-trading-economics.md §3.11 Settlement cycles"}, {"id": "reg-L3-05", "domain": "regulation", "level": 3, "topic": "market-wide-circuit-breaker-level-1", "module": "M38", "stem": "At 1:15 pm ET the S&P 500 Index is down 7% from the previous day's close. What happens under the market-wide circuit-breaker rules?", "options": ["Trading continues; a halt occurs only when the decline reaches 13%", "Trading halts for the remainder of the day", "Trading in all equity markets halts for 15 minutes", "Only the stocks in the S&P 500 are paused for 5 minutes"], "answer": 2, "explanation": "Market-wide circuit breakers key off the S&P 500: a Level 1 (7%) or Level 2 (13%) decline before 3:25 pm ET halts all markets for 15 minutes (each level once per day); a Level 3 (20%) decline closes the market for the rest of the day at any time. Per-stock 5-minute pauses are the separate LULD mechanism.", "calc": false, "source": "09-regulation-trading-economics.md §3.6 Trading halts"}, {"id": "reg-L4-01", "domain": "regulation", "level": 4, "topic": "buy-stop-limit-on-tape", "module": "M38", "stem": "A customer enters an order to buy 100 ABC at 40 STOP, limit 40.10. After entry the tape shows: 39.80, 39.95, 40.00, 40.20, 40.15, 40.05. The order is:", "options": ["Executed at 40.00", "Executed at 40.20", "Elected but cannot be executed on this tape", "Executed at 40.05"], "answer": 3, "explanation": "A buy stop is elected by the first trade at or above 40.00 (the 40.00 print) and then becomes a buy limit at 40.10, which can fill only at 40.10 or lower. The next prints 40.20 and 40.15 are above the limit; 40.05 is the first eligible trade, so the order executes at 40.05.", "calc": true, "source": "09-regulation-trading-economics.md §3.8 Stop-limit, ticker-tape worked example"}, {"id": "reg-L4-02", "domain": "regulation", "level": 4, "topic": "ex-dividend-order-adjustment-with-rounding", "module": "M38", "stem": "A customer has two open GTC orders in XYZ: buy 100 at a limit of 50.00 and sell 100 at a limit of 55.00. XYZ goes ex-dividend for a $0.125 cash dividend. Absent a DNR instruction, on the ex-date the orders are adjusted as follows:", "options": ["Buy limit reduced to 49.87; sell limit unchanged", "Buy limit reduced to 49.88; sell limit unchanged", "Both orders reduced by $0.125", "Buy limit reduced to 49.875; sell limit reduced to 54.875"], "answer": 0, "explanation": "FINRA Rule 5330 reduces only orders resting below the market (buy limits, sell stops, sell stop-limits) by the dividend, and rounds an off-tick result DOWN to the next lower quotation increment: 50.00 - 0.125 = 49.875, rounded down to 49.87. Sell limits and buy stops above the market are never adjusted for a cash dividend.", "calc": true, "source": "09-regulation-trading-economics.md §3.8 Ex-dividend order adjustment"}, {"id": "reg-L4-03", "domain": "regulation", "level": 4, "topic": "spread-components-takedown-math", "module": "M37", "stem": "A corporate stock offering has a public offering price of $30.00 and the issuer receives $28.50 per share. The manager's fee is $0.25 and the underwriting fee is $0.40; the remainder of the spread is the concession. A syndicate member that sells shares from its own allotment directly to customers earns per share:", "options": ["$0.85", "$1.10", "$1.25", "$1.50"], "answer": 2, "explanation": "Spread = $30.00 - $28.50 = $1.50; concession = $1.50 - $0.25 - $0.40 = $0.85. A syndicate member selling its own allotment keeps the takedown (underwriting fee + concession) = $0.40 + $0.85 = $1.25; the manager's fee goes to the lead underwriter on every share.", "calc": true, "source": "09-regulation-trading-economics.md §3.2 Spread and components"}, {"id": "reg-L4-04", "domain": "regulation", "level": 4, "topic": "rule-5130-immediate-family-analysis", "module": "M37", "stem": "A registered representative's firm is a syndicate member in an equity IPO. Under FINRA Rule 5130, which of the following relatives of the representative MAY purchase shares of the new issue?", "options": ["The representative's sister, who shares the representative's apartment", "The representative's retired father-in-law, for whom the $1,500 a month the representative sends is more than half of his income", "The representative's spouse, who manages a bank trust department's equity portfolio", "The representative's grandmother, who is financially independent and lives in her own home"], "answer": 3, "explanation": "Immediate family under 5130 is parents, in-laws, spouse, siblings, children and anyone the person materially supports; they are restricted when there is material support (more than 25% of the family member's income, or simply living in the same household), when the rep's firm is the one selling the new issue, or when the rep can influence allocation. The sister fails on the shared household and the father-in-law on material support. The spouse is restricted in her own right as a portfolio manager for a bank. Grandparents, aunts, uncles and cousins are not immediate family, so the financially independent grandmother may buy.", "calc": false, "source": "09-regulation-trading-economics.md §3.2 Rule 5130; §4 Classic traps"}, {"id": "reg-L4-05", "domain": "regulation", "level": 4, "topic": "rule-144-volume-limit-calculation", "module": "M37", "stem": "An affiliate of ABC Corp. files Form 144 to sell control stock. ABC has 50,000,000 shares outstanding. Reported weekly trading volume for the four weeks preceding the filing was 700,000; 500,000; 650,000; and 550,000 shares. What is the maximum number of shares the affiliate may sell over the next 90 days?", "options": ["500,000", "600,000", "1,100,000", "2,400,000"], "answer": 1, "explanation": "Rule 144 permits the GREATER of 1% of shares outstanding (500,000) or the average weekly volume of the preceding four weeks (2,400,000 / 4 = 600,000), so 600,000 shares may be sold in the 90-day window. Control stock has no holding period but is always subject to the volume limit.", "calc": true, "source": "09-regulation-trading-economics.md §3.1.3 Rule 144"}, {"id": "reg-L5-01", "domain": "regulation", "level": 5, "topic": "exempt-security-vs-exempt-transaction", "module": "M37", "stem": "All of the following are exempt SECURITIES under the Securities Act of 1933 EXCEPT:", "options": ["General obligation bonds issued by a state", "Commercial paper maturing in 180 days", "Common stock issued by a national bank", "Common stock sold to accredited investors under Rule 506(b) of Regulation D"], "answer": 3, "explanation": "Munis, commercial paper of 270 days or less, and bank (not bank holding company) securities are exempt securities under Section 3. A Regulation D private placement is an exempt TRANSACTION under Section 4: the method of sale is exempt, and the stock itself is restricted and must be registered or resold under Rule 144.", "calc": false, "source": "09-regulation-trading-economics.md §3.1.2, §3.1.3"}, {"id": "reg-L5-02", "domain": "regulation", "level": 5, "topic": "sell-stop-limit-that-never-executes", "module": "M38", "stem": "A customer enters an order to sell 100 XYZ at 45 STOP, limit 45. After entry the tape shows: 45.10, 45.00, 44.90, 44.80, 44.95, 44.85. The order is:", "options": ["Executed at 45.00", "Executed at 44.90", "Executed at 44.95", "Elected but not executed"], "answer": 3, "explanation": "The 45.10 print is above the stop and does nothing; the 45.00 print elects the order, which then becomes a sell limit at 45.00 that can fill only at 45.00 or higher. Every later print (44.90, 44.80, 44.95, 44.85) is below the limit, so the order never executes. A plain sell stop at 45 would have filled at 44.90 on the next trade.", "calc": true, "source": "09-regulation-trading-economics.md §3.8 Stop-limit; §4 Classic traps"}, {"id": "reg-L5-03", "domain": "regulation", "level": 5, "topic": "riskless-principal-markup-base", "module": "M38", "stem": "The inside market for an OTC equity is 30.00 - 30.20. A firm with no position receives a customer order to buy 300 shares, buys 300 shares from a market maker at 30.20, and immediately sells them to the customer at 30.50. Under FINRA Rule 2121, the firm's markup on this riskless principal trade is:", "options": ["Approximately 0.99%", "Approximately 1.64%", "Approximately 1.67%", "Not measured as a percentage, because the firm acted as principal"], "answer": 0, "explanation": "In a riskless principal trade the markup is measured from the firm's contemporaneous cost: (30.50 - 30.20) / 30.20 = 0.99%. Measuring against the inside bid (1.67%) or the customer's price (1.64%) is wrong, and because this is an equity the markup must also be disclosed on the confirmation.", "calc": true, "source": "09-regulation-trading-economics.md §3.9 Capacities, 5% policy worked examples"}, {"id": "reg-L5-04", "domain": "regulation", "level": 5, "topic": "cooling-off-period-permitted-activity", "module": "M37", "stem": "A registration statement for an initial public offering has been filed with the SEC but is not yet effective. Which of the following MAY a registered representative do for a customer during this cooling-off period?", "options": ["Accept a $5,000 deposit from the customer, to be refunded in full if the customer later decides not to buy", "Send the customer the red herring together with a one-page summary the representative wrote of its risk-factors section", "Note in the firm's book that the customer wants 500 shares if the final price falls within the range shown in the red herring", "Send the customer the firm's research report on the issuer, which was published before the registration statement was filed"], "answer": 2, "explanation": "During the cooling-off period a rep may distribute an unaltered red herring, publish tombstones, and take indications of interest, which are non-binding on both sides even when the customer names a quantity and a price condition. The rep may not accept money (even refundable), may not attach the rep's own summary or any sales literature to the preliminary prospectus, and may not send research on an IPO issuer (the Rule 138/139 safe harbors cover only seasoned reporting issuers).", "calc": false, "source": "09-regulation-trading-economics.md §3.1.1 Cooling-off period"}, {"id": "reg-L5-05", "domain": "regulation", "level": 5, "topic": "schedule-13d-vs-13g", "module": "M38", "stem": "An investment adviser registered under the Investment Advisers Act acquires, in the ordinary course of business for its clients' accounts, 6% of a company's registered common stock on March 10. It has no intention of influencing control of the company. What must it file, and by when?", "options": ["Schedule 13D, within 5 business days of March 10", "Schedule 13G, within 45 days after the end of the calendar quarter in which it crossed 5%", "Schedule 13G, within 10 calendar days of March 10", "Form 3, within 10 days of March 10"], "answer": 1, "explanation": "Schedule 13D is for owners above 5% who intend to influence control. Holders with no such intent file the short-form Schedule 13G; a registered investment adviser acquiring in the ordinary course of business is a qualified institutional investor, whose initial 13G is due 45 days after the end of the calendar quarter in which it crossed 5% (5 business days applies to 13D and to non-institutional passive investors; 10 calendar days was the pre-2024 13D deadline, per the October 2023 amendments effective in 2024). Form 3 applies only to Section 16 insiders (officers, directors, holders above 10%).", "calc": false, "source": "09-regulation-trading-economics.md §3.3 Beneficial ownership 13(d)/(g); §5 quick-reference table"}];
const BUILD = "2026-08-26 \u00b7 200 items";

/* ---------- Configuration ---------- */
const DOMAINS = {
  foundations:{ name:'Foundations & economics', weight:0.12 },
  equity:     { name:'Equity & analysis',        weight:0.12 },
  debt:       { name:'Debt securities',          weight:0.12 },
  municipal:  { name:'Municipal securities',     weight:0.12 },
  options:    { name:'Options',                  weight:0.16 },
  packaged:   { name:'Funds, annuities, retirement, tax', weight:0.14 },
  accounts:   { name:'Accounts, suitability, margin',     weight:0.14 },
  regulation: { name:'Laws, underwriting, trading',       weight:0.08 },
};
const DOMAIN_ORDER = Object.keys(DOMAINS);
/* Where the curriculum (00-curriculum.md §3) should start, by estimated level in each domain. */
const START_MODULE = {
  foundations:{1:'M1 (money & arithmetic)',2:'M2–M6 (securities, markets, the broker-dealer, regulators)',3:'M7–M10 (price/yield, risk, economics, statements)',4:'M11 — foundations are solid; begin the SIE product pass',5:'M11 — foundations are solid; begin the SIE product pass'},
  equity:     {1:'M11 (SIE-depth equity)',2:'M11 (SIE-depth equity)',3:'M17 (S7 equity & corporate actions)',4:'M18 (securities analysis)',5:'Review M17–M18 briefly, then move on'},
  debt:       {1:'M12 (SIE-depth debt)',2:'M12 (SIE-depth debt)',3:'M23 (quotes, yields, ratings, corporate types)',4:'M24 (convertibles, accrued interest)',5:'M25 (Treasuries, agencies, CMOs) as review'},
  municipal:  {1:'M12 then M26 (why munis, TEY, GO vs revenue)',2:'M26 (why munis, TEY, GO vs revenue)',3:'M26 → M27 (structure, pricing, taxation)',4:'M27 → M28 (primary market, MSRB rules)',5:'M28 (MSRB rulebook) as review'},
  options:    {1:'M13 (SIE-depth options)',2:'M13 (SIE-depth options)',3:'M19 (mechanics, four positions, T-chart)',4:'M20–M21 (hedges, spreads, straddles)',5:'M22 (non-equity, rules, margin, tax) as review'},
  packaged:   {1:'M14 (SIE-depth packaged products)',2:'M14 (SIE-depth packaged products)',3:'M29 (investment companies & fund math)',4:'M31 → M33 (retirement plans, taxation)',5:'M30/M32 (annuities, DPPs) as review'},
  accounts:   {1:'M15 (SIE-depth accounts & conduct)',2:'M15 (SIE-depth accounts & conduct)',3:'M34 → M35 (accounts, suitability, Reg BI, AML)',4:'M39 (margin accounts)',5:'M36 (communications) as review'},
  regulation: {1:'M6 (regulators & statutes)',2:'M6 (regulators & statutes)',3:'M37 (primary market, exemptions, underwriting)',4:'M38 (trading, settlement, reporting)',5:'Review M37–M38 briefly, then move on'},
};
const LEVEL_NAME = {1:'Everyday literacy',2:'SIE level',3:'Series 7 core',4:'Series 7 hard',5:'Expert / trap'};
const LEVEL_B = {1:-2,2:-1,3:0,4:1,5:2};   // item difficulty on the logit scale
const A = 1.1, C = 0.15;                    // 3PL discrimination and pseudo-guessing (4-option MC; "I don't know" is offered, so guessing is below 1/4)
const MIN_ITEMS = 30, MAX_ITEMS = 45, SE_STOP = 0.38, MIN_PER_DOMAIN = 3;
const SOFT_MIN_MS = 45*60*1000, HARD_MAX_MS = 60*60*1000;
const GRID = []; for (let t=-4; t<=4.0001; t+=0.05) GRID.push(+t.toFixed(2));

/* ---------- IRT ---------- */
const p3 = (theta,b) => C + (1-C)/(1+Math.exp(-A*(theta-b)));
const info = (theta,b) => { const p=p3(theta,b), q=1-p, pstar=(p-C)/(1-C); return A*A*q/p*pstar*pstar; };
function eap(responses, priorMu, priorSd) {
  // responses: [{b, correct}]; returns {theta, se}
  const w = GRID.map(t => {
    let ll = -0.5*((t-priorMu)/priorSd)**2;
    for (const r of responses) { const p=p3(t,r.b); ll += Math.log(r.correct ? p : 1-p); }
    return ll;
  });
  const m = Math.max(...w); const e = w.map(v=>Math.exp(v-m)); const Z = e.reduce((a,b)=>a+b,0);
  const theta = GRID.reduce((s,t,i)=>s+t*e[i],0)/Z;
  const varr = GRID.reduce((s,t,i)=>s+(t-theta)**2*e[i],0)/Z;
  return { theta, se: Math.sqrt(varr) };
}

/* ---------- State ---------- */
const KEY = 's7diag.v1';
let S = null;   // {started, responses:[{id,domain,level,b,answer,correct,idk,ms,thetaAfter}], finished, name}
const rng = () => Math.random();
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function reset(){ localStorage.removeItem(KEY); S=null; render(); }

function globalEst(){ return eap(S.responses, 0, 1.5); }
function domainEst(d, g){
  const rs = S.responses.filter(r=>r.domain===d);
  return { ...eap(rs, g.theta, 1.0), n: rs.length };
}
function elapsed(){ return Date.now() - S.started - (S.pausedMs||0); }

/* ---------- Item selection ---------- */
function nextItem(){
  const answered = new Set(S.responses.map(r=>r.id));
  const g = globalEst();
  const n = S.responses.length;
  // First two items anchor in foundations at SIE level, then everyday level or S7 core depending on the first answer.
  let domain;
  if (n === 0) domain = 'foundations';
  else {
    // Pick the domain furthest below its target share; tie-break by highest SE (most uncertain).
    const total = Math.max(n+1, MIN_ITEMS);
    let best=null, bestScore=-Infinity;
    for (const d of DOMAIN_ORDER) {
      const est = domainEst(d, g);
      const deficit = DOMAINS[d].weight*total - est.n;
      const score = deficit + 0.25*est.se + (est.n<MIN_PER_DOMAIN ? 0.5 : 0);
      if (score > bestScore) { bestScore=score; best=d; }
    }
    domain = best;
  }
  const est = domainEst(domain, g);
  const target = n < 4 ? g.theta : est.theta;
  const pool = BANK.filter(it => it.domain===domain && !answered.has(it.id));
  if (!pool.length) return null;
  // Max information at the current estimate; jitter breaks ties among same-level items; mild penalty for a topic already seen.
  const seenTopics = new Set(S.responses.filter(r=>r.domain===domain).map(r=>r.topic));
  let best=null, bestV=-Infinity;
  for (const it of pool) {
    const v = info(target, LEVEL_B[it.level]) + rng()*0.02 - (seenTopics.has(it.topic)?0.05:0);
    if (v>bestV) { bestV=v; best=it; }
  }
  return best;
}
function shouldStop(){
  const n = S.responses.length;
  if (n >= MAX_ITEMS) return 'max-items';
  if (elapsed() >= HARD_MAX_MS) return 'time';
  if (n < MIN_ITEMS) return null;
  const g = globalEst();
  const allCovered = DOMAIN_ORDER.every(d => S.responses.filter(r=>r.domain===d).length >= MIN_PER_DOMAIN);
  if (g.se <= SE_STOP && allCovered) return 'converged';
  return null;
}

/* ---------- Views ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMin = ms => { const m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60; return `${m}:${String(s).padStart(2,'0')}`; };

function render(){
  if (!S) return renderIntro();
  if (S.finished) return renderResults();
  renderQuestion();
}

function renderIntro(){
  const prior = load();
  $("#hdr-right").textContent = `built ${BUILD}`;
  $('#view').innerHTML = `
    <h1>Where are you starting from?</h1>
    <p>This is an <b>adaptive</b> diagnostic: each question is chosen based on how you answered the previous ones, so it homes in on your level in each of eight areas — from everyday financial literacy up to the hardest Series 7 material. It is not a pass/fail test; it tells us where the curriculum should begin for you.</p>
    <div class="card">
      <p><b>How it works</b></p>
      <ul>
        <li>About <b>30–45 questions</b>, usually <b>30–50 minutes</b>. It stops early once it's confident.</li>
        <li>Four choices per question, plus <b>“I don't know.”</b> Use it honestly — an admitted unknown is far more useful to us than a lucky guess, and it's scored the same as a wrong answer.</li>
        <li><b>No going back</b>, no feedback until the end. Expect it to feel hard: the test is designed to keep finding questions you get right about half the time.</li>
        <li>Calculator and scratch paper are fine (the real exam gives you a basic calculator). No looking things up.</li>
        <li>Keyboard: <kbd>1</kbd>–<kbd>4</kbd> select, <kbd>0</kbd> = I don't know, <kbd>Enter</kbd> confirms.</li>
      </ul>
    </div>
    <div class="row">
      <input id="name" placeholder="Your name (optional)" style="font:inherit;padding:.6rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--surface-1);color:var(--text-primary)">
      <button class="primary" id="start">Start the diagnostic</button>
      ${prior && !prior.finished ? `<button class="ghost" id="resume">Resume (${prior.responses.length} answered)</button>` : ''}
      ${prior && prior.finished ? `<button class="ghost" id="resume">View last results</button>` : ''}
    </div>`;
  $('#start').onclick = () => { S = { started: Date.now(), responses: [], finished:false, name: $('#name').value.trim(), pausedMs:0 }; save(); render(); };
  const r = $('#resume'); if (r) r.onclick = () => { S = prior; if (!S.finished) { S.started = Date.now() - (S.elapsedAtSave||0); } save(); render(); };
}

let current = null, shownAt = 0, sel = null, tick = null;
function renderQuestion(){
  const stop = shouldStop();
  if (stop) { S.finished = true; S.stopReason = stop; S.elapsedAtSave = elapsed(); save(); return renderResults(); }
  current = nextItem();
  if (!current) { S.finished = true; S.stopReason='bank-exhausted'; save(); return renderResults(); }
  sel = null; shownAt = Date.now();
  const n = S.responses.length;
  const pct = Math.min(100, Math.round(100*n/MIN_ITEMS*0.85));
  $('#view').innerHTML = `
    <div class="muted">Question ${n+1} <span id="timer"></span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="card">
      <div><span class="tag">${esc(DOMAINS[current.domain].name)}</span>${current.calc?'<span class="tag">calculation</span>':''}</div>
      <p class="stem" style="margin-top:.7rem">${esc(current.stem)}</p>
      <ul class="opts">${current.options.map((o,i)=>`<li><button class="opt" data-i="${i}"><span class="k">${i+1}.</span><span>${esc(o)}</span></button></li>`).join('')}</ul>
      <div class="row">
        <button class="primary" id="confirm" disabled>Confirm</button>
        <button class="ghost idk" id="idk">I don't know <span class="muted">(0)</span></button>
      </div>
    </div>
    <div id="timewarn"></div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => select(+b.dataset.i));
  $('#confirm').onclick = () => submit(sel, false);
  $('#idk').onclick = () => submit(null, true);
  updateTimer(); clearInterval(tick); tick = setInterval(updateTimer, 1000);
}
function select(i){ sel=i; document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel', +b.dataset.i===i)); $('#confirm').disabled=false; }
function updateTimer(){
  if (!S || S.finished) return clearInterval(tick);
  const e = elapsed(); const t=$('#timer'); if (t) t.textContent = `· ${fmtMin(e)} elapsed`;
  const w=$('#timewarn'); if (w) w.innerHTML = e>SOFT_MIN_MS ? `<div class="warnbox">Over 45 minutes — the test will wrap up at 60 minutes regardless. Keep going at your own pace.</div>` : '';
  if (e >= HARD_MAX_MS) { S.finished=true; S.stopReason='time'; save(); renderResults(); }
}
function submit(answer, idk){
  const correct = !idk && answer === current.answer;
  S.responses.push({ id:current.id, domain:current.domain, level:current.level, topic:current.topic, b:LEVEL_B[current.level], answer, idk, correct, ms: Date.now()-shownAt });
  const g = globalEst(); S.responses[S.responses.length-1].thetaAfter = +g.theta.toFixed(3); S.responses[S.responses.length-1].seAfter = +g.se.toFixed(3);
  S.elapsedAtSave = elapsed(); save();
  renderQuestion();
}
document.addEventListener('keydown', e => {
  if (!S || S.finished || !current) return;
  if (e.key>='1' && e.key<='4') select(+e.key-1);
  else if (e.key==='0') submit(null,true);
  else if (e.key==='Enter' && sel!==null) submit(sel,false);
});

/* ---------- Results ---------- */
const BANDS = [[-1.5,'Pre-foundations','Start at the very beginning: money, percent math, what a security is (M1–M6). Nothing here is bad news — it just means no prior exposure.'],
               [-0.5,'Foundations','Everyday financial literacy is there; the SIE-level vocabulary and product mechanics are not yet. Start at the foundations modules the table points to, then the SIE pass (M11–M16).'],
               [ 0.5,'SIE-ready / early Series 7','SIE-level knowledge is largely in place. Sit the SIE soon, and begin Series 7 depth in the weakest domains first.'],
               [ 1.5,'Series 7 core','Solid core knowledge. Focus on the hard-calculation and trap layer (options spreads, margin/SMA, muni syndicates, suitability scenarios) and start timed mocks.'],
               [ 9,  'Series 7 ready','Ready for full-length blueprint-faithful mocks; the remaining work is drilling the flagged misconceptions and the readiness gate (3 fresh mocks ≥ 80–85%).']];
const bandFor = t => BANDS.find(b => t < b[0]);
const levelFor = t => Math.max(1, Math.min(5, Math.round(t)+3));

function renderResults(){
  clearInterval(tick);
  const g = globalEst();
  const band = bandFor(g.theta);
  const n = S.responses.length, nc = S.responses.filter(r=>r.correct).length, nidk = S.responses.filter(r=>r.idk).length;
  const pL3 = Math.round(100*p3(g.theta,0)), pL2 = Math.round(100*p3(g.theta,-1)), pL4 = Math.round(100*p3(g.theta,1));
  const byId = Object.fromEntries(BANK.map(it=>[it.id,it]));
  const rows = DOMAIN_ORDER.map(d => { const e = domainEst(d,g); const rs=S.responses.filter(r=>r.domain===d);
    return { d, name:DOMAINS[d].name, ...e, correct:rs.filter(r=>r.correct).length, idk:rs.filter(r=>r.idk).length, wrong:rs.filter(r=>!r.correct&&!r.idk).length, level: levelFor(e.theta) }; });
  const misconceptions = S.responses.filter(r => !r.correct && !r.idk && r.b <= Math.round(g.theta)).map(r=>byId[r.id]);
  const unknowns = S.responses.filter(r => r.idk && r.b <= Math.round(g.theta)).map(r=>byId[r.id]);
  const barPct = t => Math.round(100*(t+3)/6);   // −3…+3 → 0…100
  $('#hdr-right').textContent = `${S.name?esc(S.name)+' · ':''}${n} questions · ${fmtMin(S.elapsedAtSave||0)}`;
  $('#view').innerHTML = `
    <h1>Baseline: ${esc(band[1])}</h1>
    <p>${esc(band[2])}</p>
    <div class="hero">
      <div class="tile"><div class="v">${nc}/${n}</div><div class="l">answered correctly (${nidk} “I don't know”)</div></div>
      <div class="tile"><div class="v">${g.theta.toFixed(2)} <span class="muted" style="font-size:.9rem">± ${g.se.toFixed(2)}</span></div><div class="l">ability estimate (logits; 0 = Series 7 core)</div></div>
      <div class="tile"><div class="v">${pL3}%</div><div class="l">chance of getting a typical Series 7 core question right<br><span class="muted">SIE-level ${pL2}% · S7-hard ${pL4}%</span></div></div>
      <div class="tile"><div class="v">${LEVEL_NAME[levelFor(g.theta)]}</div><div class="l">overall working level · stopped: ${esc(S.stopReason||'')}</div></div>
    </div>

    <h2>By domain</h2>
    <table>
      <thead><tr><th>Domain</th><th>Estimate</th><th>Level</th><th class="num">Items</th><th class="num">✓ / ✗ / ?</th><th>Start the curriculum at</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td>${esc(r.name)}</td>
        <td><div class="bar" title="θ ${r.theta.toFixed(2)} ± ${r.se.toFixed(2)}"><i style="width:${barPct(r.theta)}%"></i><b style="left:${barPct(0)}%" title="Series 7 core"></b></div><span class="muted">${r.theta.toFixed(2)} ± ${r.se.toFixed(2)}</span></td>
        <td>${LEVEL_NAME[r.level]}</td>
        <td class="num">${r.n}</td>
        <td class="num">${r.correct} / ${r.wrong} / ${r.idk}</td>
        <td>${esc(START_MODULE[r.d][r.level])}</td></tr>`).join('')}</tbody>
    </table>
    <p class="muted">Bars run from −3 (no exposure) to +3 (expert); the tick marks 0 = Series 7 core. Domain estimates with only 3–5 items are wide (± shown) — treat them as a starting point, not a verdict.</p>

    <h2>How the estimate moved</h2>
    <div class="card">${trajectorySvg()}</div>

    <h2>Priority fixes — confident but wrong (${misconceptions.length})</h2>
    <p class="muted">Questions at or below your estimated level that you answered rather than skipped. These are the misconceptions to clear first.</p>
    ${misconceptions.length ? misconceptions.map(reviewRow).join('') : '<p class="muted">None — every miss was above your level or an honest “I don’t know.”</p>'}

    <h2>Gaps — “I don't know” at your level (${unknowns.length})</h2>
    ${unknowns.length ? unknowns.map(reviewRow).join('') : '<p class="muted">None.</p>'}

    <details><summary>Review every question (${n})</summary>${S.responses.map(r=>reviewRow(byId[r.id])).join('')}</details>

    <h2>Export</h2>
    <div class="row">
      <button class="primary" id="dl">Download results JSON</button>
      <button class="ghost" id="copy">Copy text summary</button>
      <button class="ghost" id="again">Start over</button>
    </div>
    <pre id="summary" class="hidden"></pre>`;
  const exportObj = { build:BUILD, name:S.name, finishedAt:new Date().toISOString(), elapsedMs:S.elapsedAtSave, stopReason:S.stopReason,
    overall:{ theta:+g.theta.toFixed(3), se:+g.se.toFixed(3), band:band[1], pCoreCorrect:pL3 },
    domains: rows.map(r=>({domain:r.d, theta:+r.theta.toFixed(3), se:+r.se.toFixed(3), n:r.n, correct:r.correct, wrong:r.wrong, idk:r.idk, level:r.level, startAt:START_MODULE[r.d][r.level]})),
    misconceptions: misconceptions.map(i=>i.id), unknownsAtLevel: unknowns.map(i=>i.id), responses:S.responses };
  const txt = [`Series 7 diagnostic — ${S.name||'(unnamed)'} — ${new Date().toLocaleDateString()}`,
    `Overall: ${band[1]} (θ ${g.theta.toFixed(2)} ± ${g.se.toFixed(2)}; ${nc}/${n} correct, ${nidk} IDK; ${fmtMin(S.elapsedAtSave||0)})`,
    ...rows.map(r=>`  ${r.name}: ${LEVEL_NAME[r.level]} (θ ${r.theta.toFixed(2)} ± ${r.se.toFixed(2)}, ${r.correct}/${r.n}) → ${START_MODULE[r.d][r.level]}`),
    `Confident-wrong at level: ${misconceptions.map(i=>i.id).join(', ')||'none'}`,
    `IDK at level: ${unknowns.map(i=>i.id).join(', ')||'none'}`].join('\n');
  $('#dl').onclick = () => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(exportObj,null,2)],{type:'application/json'})); a.download=`series7-diagnostic-${(S.name||'result').replace(/\W+/g,'-')}-${new Date().toISOString().slice(0,10)}.json`; a.click(); };
  $('#copy').onclick = async () => { $('#summary').textContent=txt; $('#summary').classList.remove('hidden'); try { await navigator.clipboard.writeText(txt); $('#copy').textContent='Copied'; } catch {} };
  $('#again').onclick = () => { if (confirm('Discard these results and start over?')) reset(); };
  window.__diagExport = exportObj;
}
function reviewRow(it){
  const r = S.responses.find(x=>x.id===it.id);
  const mark = r.correct ? '<span class="ok">✓ correct</span>' : r.idk ? '<span class="idkc">? didn\'t know</span>' : '<span class="bad">✗ incorrect</span>';
  return `<div class="rev"><div class="muted">${esc(DOMAINS[it.domain].name)} · ${LEVEL_NAME[it.level]} · ${mark} · ${Math.round(r.ms/1000)}s</div>
    <div class="s">${esc(it.stem)}</div>
    <div class="e"><b>Answer:</b> ${esc(it.options[it.answer])}${(!r.correct&&!r.idk)?` &nbsp;<span class="bad">You chose:</span> ${esc(it.options[r.answer])}`:''}<br>${esc(it.explanation)} <span class="muted">(${esc(it.module)})</span></div></div>`;
}
function trajectorySvg(){
  const pts = S.responses.map(r=>r.thetaAfter), ses = S.responses.map(r=>r.seAfter);
  const W=720,H=200,px=36,py=16, n=pts.length; if (n<2) return '<p class="muted">Not enough answers to chart.</p>';
  const x=i=>px+(W-2*px)*i/(n-1), y=t=>py+(H-2*py)*(3-Math.max(-3,Math.min(3,t)))/6;
  const path = pts.map((t,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(t).toFixed(1)}`).join(' ');
  const band = pts.map((t,i)=>`${x(i).toFixed(1)},${y(t+ses[i]).toFixed(1)}`).concat(pts.map((t,i)=>`${x(i).toFixed(1)},${y(t-ses[i]).toFixed(1)}`).reverse()).join(' ');
  const grid = [-2,-1,0,1,2].map(v=>`<line x1="${px}" x2="${W-px}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.5:1}"/><text x="${px-6}" y="${y(v)+4}" text-anchor="end">${v>0?'+':''}${v}</text>`).join('');
  const dots = S.responses.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.thetaAfter)}" r="4" fill="${r.correct?'var(--series-1)':'var(--surface-1)'}" stroke="var(--series-1)" stroke-width="2"><title>Q${i+1} ${DOMAINS[r.domain].name} · ${LEVEL_NAME[r.level]} · ${r.correct?'correct':r.idk?'IDK':'incorrect'} · θ ${r.thetaAfter.toFixed(2)} ± ${r.seAfter.toFixed(2)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ability estimate after each question with uncertainty band">
    ${grid}<polygon points="${band}" fill="var(--series-1)" opacity=".15"/><path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2"/>${dots}
    <text x="${W-px}" y="${H-2}" text-anchor="end">question 1 → ${n} · filled dot = correct · shaded = ±1 SE · 0 = Series 7 core</text></svg>`;
}

/* ---------- Test hook (used by the automated check; harmless for users) ---------- */
window.__diag = {
  get state(){ return S; }, bank: BANK, p3, eap,
  start(name){ S={started:Date.now(),responses:[],finished:false,name:name||'',pausedMs:0}; save(); render(); },
  current(){ return current; },
  answer(i, idk){ submit(idk?null:i, !!idk); },
  reset,
};

/* ---------- Boot ---------- */
const prior = load(); if (prior && prior.finished) { S = prior; }
render();
</script>
</body>
</html>
