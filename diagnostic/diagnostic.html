<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Series 7 Diagnostic — adaptive baseline exam</title>
<style>
  :root{
    color-scheme:light;
    --surface-1:#fcfcfb; --surface-2:#f1f1ee; --line:#dcdcd6;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#8a8985;
    --series-1:#2a78d6; --series-1-soft:#d6e6f8;
    --good:#008300; --serious:#e34948; --warn:#c98500;
  }
  @media (prefers-color-scheme:dark){
    :root{
      color-scheme:dark;
      --surface-1:#1a1a19; --surface-2:#242423; --line:#3a3a38;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8e88;
      --series-1:#3987e5; --series-1-soft:#213a5c;
      --good:#3fbf3f; --serious:#e66767; --warn:#e0a020;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface-1);color:var(--text-primary);font:17px/1.55 -apple-system,Inter,system-ui,sans-serif}
  main{max-width:820px;margin:0 auto;padding:1.25rem 1.25rem 5rem}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;border-bottom:1px solid var(--line);padding-bottom:.6rem;margin-bottom:1.2rem;font-size:14px;color:var(--text-secondary)}
  header b{color:var(--text-primary)}
  h1{font-size:1.6rem;margin:.2rem 0 .8rem}
  h2{font-size:1.2rem;margin:1.8rem 0 .6rem}
  p{margin:.5rem 0}
  .card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.25rem;margin:1rem 0}
  .stem{font-size:1.12rem;line-height:1.5;white-space:pre-wrap}
  .tag{display:inline-block;font-size:12px;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;margin-right:.4rem}
  .opts{list-style:none;padding:0;margin:1rem 0 0}
  .opts li{margin:.45rem 0}
  .opt{width:100%;text-align:left;display:flex;gap:.75rem;align-items:flex-start;background:var(--surface-1);color:var(--text-primary);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem;font:inherit;cursor:pointer}
  .opt:hover{border-color:var(--series-1)}
  .opt.sel{border-color:var(--series-1);background:var(--series-1-soft)}
  .opt .k{font-weight:600;color:var(--text-secondary);min-width:1.3em}
  .row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-top:1rem}
  button.primary{background:var(--series-1);color:#fff;border:0;border-radius:8px;padding:.65rem 1.2rem;font:inherit;font-weight:600;cursor:pointer}
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--line);border-radius:8px;padding:.6rem 1rem;font:inherit;cursor:pointer}
  .idk{margin-left:auto}
  .muted{color:var(--text-muted);font-size:14px}
  .progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:.4rem 0 1rem}
  .progress i{display:block;height:100%;background:var(--series-1);border-radius:3px;transition:width .3s}
  table{border-collapse:collapse;width:100%;font-size:15px;margin:.6rem 0}
  th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--text-secondary);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{height:10px;background:var(--surface-1);border:1px solid var(--line);border-radius:4px;position:relative;min-width:160px}
  .bar i{position:absolute;top:0;bottom:0;left:0;background:var(--series-1);border-radius:3px}
  .bar b{position:absolute;top:-4px;width:2px;height:16px;background:var(--text-muted)}
  .hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin:1rem 0}
  .tile{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem}
  .tile .v{font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
  .tile .l{font-size:13px;color:var(--text-secondary)}
  details{margin:.5rem 0;border:1px solid var(--line);border-radius:8px;padding:.5rem .9rem;background:var(--surface-2)}
  summary{cursor:pointer;font-weight:600}
  .rev{padding:.6rem 0;border-top:1px solid var(--line)}
  .rev:first-of-type{border-top:0}
  .rev .s{font-weight:500}
  .rev .e{color:var(--text-secondary);font-size:15px;margin-top:.3rem}
  .ok{color:var(--good)} .bad{color:var(--serious)} .idkc{color:var(--warn)}
  svg text{fill:var(--text-secondary);font-size:11px}
  .hidden{display:none}
  .warnbox{border-left:3px solid var(--warn);padding:.4rem .9rem;background:var(--surface-2);margin:.8rem 0;font-size:15px}
  kbd{font:13px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 .35em;color:var(--text-secondary)}
  pre{white-space:pre-wrap;font-size:13px;background:var(--surface-2);padding:.8rem;border-radius:8px;border:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <header>
    <div><b>Series 7 Diagnostic</b> · adaptive baseline</div>
    <div id="hdr-right" class="muted"></div>
  </header>
  <div id="view"></div>
</main>

<script>
/* ---------- Item bank (inlined by build.py) ---------- */
const BANK = [{"id": "acct-L1-01", "domain": "accounts", "level": 1, "topic": "leverage-intuition", "module": "M15", "stem": "An investor has $10,000 to invest in a stock. A friend suggests borrowing another $10,000 from the brokerage firm so she can buy $20,000 worth of shares. Compared with investing only her own $10,000, borrowing to buy the stock will:", "options": ["reduce her risk, because the loan is secured by the shares she buys", "have no effect on her percentage gain or loss, since she owns the same stock either way", "magnify both her percentage gain and her percentage loss on the $10,000 of her own money", "guarantee a larger profit, because she owns twice as many shares"], "answer": 2, "explanation": "The $10,000 loan does not change when the stock moves, so every dollar of price change lands on her own $10,000: a 10% move on $20,000 of stock ($2,000) is a 20% gain or loss on her equity. Leverage cuts both ways; it never reduces risk or guarantees profit.", "calc": false, "source": "08-accounts-suitability-margin.md §3.9.4, §5.2"}, {"id": "acct-L1-02", "domain": "accounts", "level": 1, "topic": "why-customer-profile", "module": "M15", "stem": "Before recommending an investment, a registered representative asks a new customer about her goals, how soon she will need the money, and how much risk she can tolerate. The MAIN reason for gathering this information is to:", "options": ["make sure any recommendation actually fits this customer's situation and needs", "determine the commission rate the firm is permitted to charge her", "decide whether the customer is allowed to open an account at all", "verify the customer's identity for the government"], "answer": 0, "explanation": "Objectives, time horizon and risk tolerance are elements of the customer investment profile; a recommendation must be suitable (in the customer's best interest) for this specific customer. Identity verification is a separate process (CIP), and an account can be opened even if the customer declines to give financial information.", "calc": false, "source": "08-accounts-suitability-margin.md §3.4.1, §3.1.3"}, {"id": "acct-L1-03", "domain": "accounts", "level": 1, "topic": "jtwros-survivorship-intuition", "module": "M15", "stem": "A married couple opens a brokerage account titled \"joint tenants with right of survivorship.\" If one spouse dies, what happens to the assets in the account?", "options": ["Half of the account is frozen until the decedent's will is settled in probate court", "The surviving spouse automatically owns the entire account, without the assets passing through the decedent's estate", "The account is split between the surviving spouse and the heirs named in the decedent's will", "The brokerage firm liquidates the account and pays the proceeds to the estate"], "answer": 1, "explanation": "\"Right of survivorship\" means the decedent's interest passes automatically to the surviving owner(s), outside probate. Passing a share to the estate is what happens under tenants in common, not JTWROS.", "calc": false, "source": "08-accounts-suitability-margin.md §3.2.3, §3.6.5"}, {"id": "acct-L1-04", "domain": "accounts", "level": 1, "topic": "sipc-not-market-loss", "module": "M15", "stem": "An investor's stock portfolio held at a brokerage firm falls 40% during a market downturn. He asks whether SIPC will reimburse his losses. The BEST response is that SIPC:", "options": ["reimburses investors for losses up to $500,000 whenever their securities decline in value", "reimburses market losses only if the decline exceeds $250,000", "is a government agency that insures brokerage accounts the same way the FDIC insures bank deposits", "protects customers only when a brokerage firm fails and their cash or securities are missing, not against market losses"], "answer": 3, "explanation": "SIPC is a non-profit membership corporation (not a government agency) that steps in when a broker-dealer becomes insolvent and customer assets are missing, up to $500,000 per separate customer including $250,000 cash. It never covers a decline in the market value of securities.", "calc": false, "source": "08-accounts-suitability-margin.md §3.8"}, {"id": "acct-L1-05", "domain": "accounts", "level": 1, "topic": "trusted-contact-purpose", "module": "M15", "stem": "When opening an account, a brokerage firm asks the customer to name a \"trusted contact person.\" What is the purpose of this contact?", "options": ["The trusted contact may place trades for the customer while the customer is traveling", "The trusted contact becomes the beneficiary of the account when the customer dies", "The trusted contact must co-sign any withdrawal from the account over $10,000", "The firm may call the trusted contact if it suspects the customer is being financially exploited or cannot reach the customer"], "answer": 3, "explanation": "Under Rule 4512 the firm makes reasonable efforts to obtain a trusted contact (age 18+) whom it may call to address possible financial exploitation, confirm the customer's contact information or health status, or identify a guardian or POA holder. The TCP has no trading authority and is not a beneficiary.", "calc": false, "source": "08-accounts-suitability-margin.md §3.1.5"}, {"id": "acct-L2-01", "domain": "accounts", "level": 2, "topic": "new-account-form-signatures", "module": "M34", "stem": "Which of the following signatures is REQUIRED on the new account form for an individual cash account?", "options": ["The customer's signature", "The registered representative's signature", "The signatures of both the customer and the registered representative", "The signature of a principal (partner, officer or manager) accepting the account"], "answer": 3, "explanation": "Rule 4512 requires the signature of the partner, officer or manager denoting acceptance of the account. The customer's signature is not required on a cash new account form (the customer signs the margin, options or discretionary agreements), and only the representative's name, not signature, is required.", "calc": false, "source": "08-accounts-suitability-margin.md §3.1.1, §4 trap 1"}, {"id": "acct-L2-02", "domain": "accounts", "level": 2, "topic": "utma-features", "module": "M34", "stem": "Which of the following statements about an UTMA custodial account is TRUE?", "options": ["A gift made into the account is irrevocable and belongs to the minor", "One custodian may hold the assets of several minors in a single account", "The custodian may buy securities on margin to accelerate the account's growth", "The account is opened under the custodian's Social Security number"], "answer": 0, "explanation": "UTMA/UGMA gifts are irrevocable and indefeasibly vested in the minor, who is the beneficial owner and whose SSN is used. Each account has one custodian and one minor, and margin, short sales and uncovered options are prohibited.", "calc": false, "source": "08-accounts-suitability-margin.md §3.2.4"}, {"id": "acct-L2-03", "domain": "accounts", "level": 2, "topic": "cip-refused-tin", "module": "M34", "stem": "A prospective customer wishes to open a cash account but refuses to provide a Social Security number or taxpayer identification number and has not applied for one. Under the firm's Customer Identification Program, the firm should:", "options": ["open the account and withhold 24% of any dividends and interest as backup withholding", "not open the account, because an identification number is required before an account may be opened", "open the account but accept only unsolicited orders", "open the account and report the refusal to FINRA within 30 days"], "answer": 1, "explanation": "CIP (31 CFR 1023.220) requires name, date of birth, address and an identification number before opening; the only exception is a customer who has applied for a TIN. Backup withholding applies to a customer who provides a TIN but will not certify it on Form W-9, and unsolicited-only treatment applies to a customer who declines to give financial information, not identity information.", "calc": false, "source": "08-accounts-suitability-margin.md §3.1.3"}, {"id": "acct-L2-04", "domain": "accounts", "level": 2, "topic": "aml-layering-stage", "module": "M35", "stem": "A customer deposits funds, then repeatedly wires money among accounts at several institutions in different countries and buys and sells securities with no apparent investment purpose, making the origin of the funds difficult to trace. This activity is characteristic of which stage of money laundering?", "options": ["Placement", "Structuring", "Layering", "Integration"], "answer": 2, "explanation": "Layering is the movement of funds through multiple transactions and accounts to obscure the audit trail; brokerage accounts are most exposed at this stage. Placement is the entry of cash into the system, integration is the re-emergence of funds as legitimate assets, and structuring is a cash-reporting evasion technique, not one of the three stages.", "calc": false, "source": "08-accounts-suitability-margin.md §3.7"}, {"id": "acct-L2-05", "domain": "accounts", "level": 2, "topic": "reg-bi-four-obligations", "module": "M35", "stem": "Regulation Best Interest requires a broker-dealer to satisfy four component obligations when recommending a securities transaction or strategy to a retail customer. Which of the following is NOT one of those four obligations?", "options": ["Care Obligation", "Conflict of Interest Obligation", "Best Execution Obligation", "Compliance Obligation"], "answer": 2, "explanation": "Reg BI's four obligations are Disclosure, Care, Conflict of Interest and Compliance. Best execution is a separate duty under FINRA Rule 5310, not a component of Reg BI.", "calc": false, "source": "08-accounts-suitability-margin.md §3.4.3"}, {"id": "acct-L3-01", "domain": "accounts", "level": 3, "topic": "reg-t-deposit-and-deadline", "module": "M39", "stem": "A customer with an existing margin account (equity well above $2,000) buys 200 shares of XYZ at $60 per share on Monday. Under Regulation T, what deposit is required and by when? (Assume no market holidays.)", "options": ["$6,000, no later than Thursday, three business days after the trade date", "$3,000, no later than Thursday, three business days after the trade date", "$6,000, no later than Tuesday, the settlement date", "$12,000, no later than Friday, four business days after the trade date"], "answer": 0, "explanation": "200 x $60 = $12,000; Reg T initial requirement is 50% = $6,000. Payment is due within one payment period = settlement (T+1) plus two business days = T+3, so a Monday trade must be paid by Thursday; the older T+4 figure predates the May 2024 move to T+1 settlement.", "calc": true, "source": "08-accounts-suitability-margin.md §3.9.3, §4 memorization table"}, {"id": "acct-L3-02", "domain": "accounts", "level": 3, "topic": "rule-2210-retail-communication", "module": "M36", "stem": "A registered representative sends the same letter recommending a mutual fund to 40 retail customers over a two-week period. Under FINRA Rule 2210, this letter is classified as:", "options": ["correspondence, subject to supervisory review but not principal pre-approval", "a retail communication, requiring approval by an appropriately qualified registered principal before use", "an institutional communication, because it was sent only to existing customers", "a public appearance, because it contains a recommendation"], "answer": 1, "explanation": "A written communication sent to more than 25 retail investors within any 30-calendar-day period is a retail communication and needs prior principal approval; 25 or fewer would be correspondence. Being an existing customer does not make a person an institutional investor.", "calc": false, "source": "08-accounts-suitability-margin.md §3.5.1"}, {"id": "acct-L3-03", "domain": "accounts", "level": 3, "topic": "tenants-in-common-fit", "module": "M34", "stem": "Two unrelated business associates want to open a joint brokerage account in which one contributes 60% of the capital and the other 40%. Each wants his share to pass to his own heirs, not to the other owner, at death. Which form of joint ownership BEST fits their needs?", "options": ["Joint tenants with right of survivorship", "Community property", "Transfer on death registration in one owner's name", "Tenants in common"], "answer": 3, "explanation": "Tenants in common permits specified, unequal fractional interests, and a decedent's fraction passes to his estate rather than to the surviving owner. JTWROS requires equal interests and passes everything to the survivor; community property is limited to married couples in community-property states.", "calc": false, "source": "08-accounts-suitability-margin.md §3.2.3"}, {"id": "acct-L3-04", "domain": "accounts", "level": 3, "topic": "rule-3210-outside-accounts", "module": "M35", "stem": "A registered representative of Member Firm A wants to open a personal brokerage account at Member Firm B in which she will buy and sell individual stocks. Under FINRA Rule 3210, she must:", "options": ["notify FINRA in writing within 30 days of opening the account", "obtain prior written consent from Firm B and arrange for duplicate statements to be sent to FINRA", "obtain prior written consent from Firm A and notify Firm B in writing that she is associated with Firm A", "do nothing, because Rule 3210 applies only to discretionary accounts"], "answer": 2, "explanation": "Rule 3210 requires the employing member's prior written consent and written notice of the association to the executing firm, which then supplies duplicate confirmations and statements upon the employer's request. FINRA is not notified; only accounts limited to mutual funds, UITs, variable contracts or 529 plans are exempt.", "calc": false, "source": "08-accounts-suitability-margin.md §3.3.1"}, {"id": "acct-L3-05", "domain": "accounts", "level": 3, "topic": "death-of-customer-poa-terminates", "module": "M34", "stem": "A registered representative learns that a customer holding an individual account died yesterday. The customer's son, who holds a durable power of attorney over the account, calls and instructs the representative to sell all positions. The representative should:", "options": ["cancel all open orders, freeze the account, and await instructions from the estate's court-appointed executor or administrator", "execute the son's sell order, because a durable power of attorney survives the grantor's death", "execute the order only after obtaining a certified copy of the death certificate from the son", "transfer the positions into the son's name, since he is the next of kin"], "answer": 0, "explanation": "Any power of attorney, durable or not, terminates at the grantor's death. On notice of death the firm cancels open orders, marks the account deceased, and takes instructions only from the executor or administrator once letters testamentary or letters of administration are presented.", "calc": false, "source": "08-accounts-suitability-margin.md §3.6.5, §3.2.9"}, {"id": "acct-L4-01", "domain": "accounts", "level": 4, "topic": "sma-and-buying-power-after-rise", "module": "M39", "stem": "A customer opens a margin account by buying 500 shares of ABC at $80 and deposits the Regulation T requirement. ABC subsequently rises to $100. Assuming no other activity, what is the customer's buying power for additional marginable securities?", "options": ["$5,000", "$10,000", "$20,000", "$30,000"], "answer": 1, "explanation": "LMV $40,000, deposit $20,000, DR $20,000. At $100: LMV $50,000, EQ $30,000, Reg T requirement $25,000, excess equity (SMA) $5,000. Buying power = SMA x 2 = $10,000; $5,000 is the SMA itself, $30,000 is the equity.", "calc": true, "source": "08-accounts-suitability-margin.md §3.9.4 State A, §3.9.5"}, {"id": "acct-L4-02", "domain": "accounts", "level": 4, "topic": "maintenance-call-amount", "module": "M39", "stem": "A customer's long margin account has a debit balance of $30,000. After a market decline, the long market value is $36,000. Under FINRA's 25% minimum maintenance requirement, what is the status of the account?", "options": ["Restricted, but no maintenance call, because equity is still positive", "A maintenance call of $9,000", "A maintenance call of $12,000", "A maintenance call of $3,000"], "answer": 3, "explanation": "EQ = $36,000 - $30,000 = $6,000, which is 16.7% of LMV. Maintenance requirement = 25% x $36,000 = $9,000, so the call is $9,000 - $6,000 = $3,000. $9,000 is the requirement, not the call, and $12,000 comes from wrongly using 50% ($18,000 - $6,000).", "calc": true, "source": "08-accounts-suitability-margin.md §3.9.4 State C"}, {"id": "acct-L4-03", "domain": "accounts", "level": 4, "topic": "short-account-equity", "module": "M39", "stem": "A customer sells short 1,000 shares of DEF at $40 and deposits the Regulation T requirement. DEF later rises to $48. What is the equity in the short margin account?", "options": ["$12,000", "$14,400", "$20,000", "$28,000"], "answer": 0, "explanation": "Credit balance = $40,000 proceeds + $20,000 deposit = $60,000 and does not change with price. CR - SMV = $60,000 - $48,000 = $12,000 equity; the $8,000 rise reduces a short seller's equity. $28,000 moves equity the wrong direction, $20,000 ignores the price change, and $14,400 is the 30% maintenance requirement (so the account also has a $2,400 call).", "calc": true, "source": "08-accounts-suitability-margin.md §3.9.6"}, {"id": "acct-L4-04", "domain": "accounts", "level": 4, "topic": "suitability-income-high-bracket", "module": "M35", "stem": "A 72-year-old retired customer has a net worth of $3 million, is in the highest federal income tax bracket, and states that her objective is current income with preservation of capital. She has no near-term liquidity needs. Which of the following is the MOST suitable recommendation?", "options": ["Zero-coupon Treasury bonds", "A diversified portfolio of small-cap growth stocks", "Investment-grade municipal bonds", "High-yield corporate bonds"], "answer": 2, "explanation": "Current income plus preservation points to investment-grade debt, and the highest tax bracket makes tax-exempt municipal bonds the best fit. Zero-coupon bonds pay no current income, growth stocks do not match the objective, and high-yield bonds sacrifice the preservation-of-capital requirement.", "calc": false, "source": "08-accounts-suitability-margin.md §3.4.2 objective-to-product table"}, {"id": "acct-L4-05", "domain": "accounts", "level": 4, "topic": "sar-vs-ctr-thresholds", "module": "M35", "stem": "A customer who owns a retail store deposits $9,500 in currency and asks the registered representative whether the deposit \"will be reported to the government.\" Two business days later he deposits another $9,000 in currency. Which of the following describes the firm's obligation?", "options": ["File a Currency Transaction Report within 15 days, because the deposits exceed $10,000 in aggregate", "File a Suspicious Activity Report within 30 calendar days of detection, without informing the customer", "No filing is required, because no single deposit exceeded $10,000", "Notify OFAC and block the account pending review"], "answer": 1, "explanation": "A CTR aggregates cash only within a single business day, so two sub-$10,000 deposits on different days do not trigger one. But the pattern plus the customer's concern about reporting is a structuring red flag; the aggregate exceeds the $5,000 SAR threshold, so a SAR must be filed within 30 calendar days and the customer must not be tipped off. OFAC screening concerns sanctioned persons, not cash reporting.", "calc": false, "source": "08-accounts-suitability-margin.md §3.7, §4 trap 15"}, {"id": "acct-L5-01", "domain": "accounts", "level": 5, "topic": "sma-not-excess-after-decline", "module": "M39", "stem": "A customer buys 1,000 shares of GHI at $50 in a new margin account and deposits the Regulation T requirement. GHI rises to $70 and then falls back to $60. The customer has used no SMA and made no other transactions. After the decline to $60, what is the balance in the SMA?", "options": ["$0, because the account no longer has excess equity above its previous high", "$5,000", "$10,000", "$20,000"], "answer": 2, "explanation": "DR is fixed at $25,000. At $70: LMV $70,000, EQ $45,000, Reg T $35,000, so SMA is set at $10,000. At $60: LMV $60,000, EQ $35,000, Reg T $30,000, so current excess equity is only $5,000, but SMA is a high-water mark that falls only when used, so it remains $10,000 ($20,000 is the resulting buying power).", "calc": true, "source": "08-accounts-suitability-margin.md §3.9.5, §4 trap 23"}, {"id": "acct-L5-02", "domain": "accounts", "level": 5, "topic": "minimum-equity-vs-cost-exception", "module": "M39", "stem": "A customer opens a new margin account and, as her first transaction, buys 100 shares of JKL at $15 per share. What is the minimum deposit required?", "options": ["$1,500", "$750", "$2,000", "$3,000"], "answer": 0, "explanation": "The purchase is 100 x $15 = $1,500. Reg T would call for 50% ($750) and FINRA's $2,000 minimum would exceed that, but Rule 4210 never requires a deposit greater than the full cost of a long purchase, so the deposit is $1,500. Had this been a short sale of $1,500, the full $2,000 would be required.", "calc": true, "source": "08-accounts-suitability-margin.md §3.9.3 decision table"}, {"id": "acct-L5-03", "domain": "accounts", "level": 5, "topic": "restricted-account-sale-release", "module": "M39", "stem": "A customer's margin account shows long market value of $50,000 and a debit balance of $28,000. The customer sells $10,000 of stock from the account. What is the MAXIMUM cash the customer may withdraw as a result of this sale?", "options": ["$0, because a restricted account must apply all sale proceeds to the debit balance", "$7,000, the proceeds remaining after the Regulation T deficiency is cured", "$10,000, the full proceeds, because a sale reduces the debit balance", "$5,000"], "answer": 3, "explanation": "EQ = $50,000 - $28,000 = $22,000 versus a Reg T requirement of $25,000, so the account is restricted by $3,000. A restricted account is not required to cure the deficiency; the retention requirement is 50% of sale proceeds, so $5,000 pays down the debit and $5,000 may be withdrawn. After the sale and withdrawal the debit is $28,000 - $10,000 + $5,000 = $23,000 against LMV $40,000, leaving equity of $17,000 (42.5%), comfortably above the 25% maintenance requirement.", "calc": true, "source": "08-accounts-suitability-margin.md §3.9.4 restricted account, §5.4"}, {"id": "acct-L5-04", "domain": "accounts", "level": 5, "topic": "time-and-price-vs-discretion", "module": "M34", "stem": "On Monday morning a customer telephones his registered representative and says, \"Buy 300 shares of MNO for me today, whenever you think the price looks best.\" No written discretionary authorization is on file. Watching the stock, the representative buys the 300 shares on Tuesday afternoon. Which statement is CORRECT?", "options": ["The trade was properly executed, because the customer specified the action, the asset and the amount", "The trade required prior written discretionary authorization even on Monday, because the representative chose the time and price", "The customer's instruction was valid only until the close of business on Monday; the Tuesday purchase was an unauthorized discretionary trade", "The trade was proper because a principal may approve time-and-price orders promptly after execution"], "answer": 2, "explanation": "When the customer fixes action, asset and amount and leaves only time and price to the representative, no written discretion is needed, but under Rule 3260 that authority is good only until the end of that business day absent a signed, dated written extension. Executing on Tuesday required fresh instructions or written discretionary authorization.", "calc": false, "source": "08-accounts-suitability-margin.md §3.2.10, §4 trap 3"}, {"id": "acct-L5-05", "domain": "accounts", "level": 5, "topic": "margin-agreement-parts-and-rehypothecation-limit", "module": "M39", "stem": "A customer's margin account holds stock with a long market value of $60,000 against a debit balance of $22,000. When the account was opened the customer signed the credit agreement and the hypothecation agreement but declined to sign the loan consent. Which statement is CORRECT?", "options": ["The firm may not carry the margin account, because every part of the margin agreement must be signed before credit is extended", "The firm may repledge up to $30,800 of the customer's securities to a bank as collateral for the margin loan, but may not lend her shares to a short seller", "The firm may lend the customer's shares to a short seller but may not repledge any of them to a bank", "The firm may repledge the full $60,000 position to a bank, because the hypothecation agreement sets no limit on the amount repledged"], "answer": 1, "explanation": "The loan consent is the only optional part of the margin agreement, and it is the piece that permits the firm to lend the customer's securities to short sellers; without it the firm may not lend them out. The hypothecation agreement, which she did sign, lets the firm repledge her securities to a bank, but SEC Rules 8c-1/15c2-1 cap rehypothecation at 140% of the debit balance: 1.40 x $22,000 = $30,800. The excess must be segregated.", "calc": true, "source": "08-accounts-suitability-margin.md §3.9.1, §3.9.2"}, {"id": "debt-L1-01", "domain": "debt", "level": 1, "topic": "what-a-bond-is", "module": "M12", "stem": "Maria pays $1,000 for a bond issued by a large company. In plain terms, what has she done?", "options": ["Bought a small ownership share of the company", "Lent the company money in exchange for regular interest and repayment of the $1,000 at a set date", "Deposited money in an account insured by the federal government", "Agreed to share in the company's profits and losses each year"], "answer": 1, "explanation": "A bond is an IOU: the investor is the lender, the issuer is the borrower, interest is the rent on the money and the principal is repaid at maturity (04-debt.md §2 item 1, §3.1.1). Ownership and profit-sharing describe stock; deposit insurance describes a bank account.", "calc": false, "source": "04-debt.md §2, §3.1.1"}, {"id": "debt-L1-02", "domain": "debt", "level": 1, "topic": "rates-up-prices-down", "module": "M12", "stem": "Two years ago Dan bought a bond that pays 4% interest a year. Similar new bonds now pay 6%. If Dan tries to sell his bond today, what happens to its price?", "options": ["It stays the same, because the issuer still pays exactly 4%", "It rises, because older bonds are scarce", "It rises, because the 4% payment is guaranteed", "It falls, because a buyer can get 6% elsewhere and will only take Dan's bond at a discount"], "answer": 3, "explanation": "A bond is a fixed stream of payments; when the going rate rises, that fixed stream is worth less, so the price must fall until its yield matches the market (04-debt.md §2 items 3-4, §3.4.5).", "calc": false, "source": "04-debt.md §3.4.5"}, {"id": "debt-L1-03", "domain": "debt", "level": 1, "topic": "what-a-credit-rating-tells-you", "module": "M12", "stem": "A rating agency gives a company's bonds a very low rating. What does this MOST directly tell an investor?", "options": ["There is a higher chance the company will fail to make its interest or principal payments", "The bond's price will fall sharply if interest rates rise", "The company pays interest less often than other issuers", "The bond cannot be sold before it matures"], "answer": 0, "explanation": "Ratings measure default (credit) risk only, not interest-rate risk, payment frequency or liquidity (04-debt.md §3.8.1). A low rating is like a bad credit score for the borrower.", "calc": false, "source": "04-debt.md §3.8.1"}, {"id": "debt-L1-04", "domain": "debt", "level": 1, "topic": "who-gets-paid-first-in-bankruptcy", "module": "M12", "stem": "A company goes out of business and its assets are sold to pay everyone it owes. Which group is generally paid FIRST?", "options": ["Common stockholders", "Preferred stockholders", "Lenders whose bonds are backed by specific company property", "No one is first; all claims are paid in equal proportion"], "answer": 2, "explanation": "Secured creditors are paid first from their collateral, then unsecured creditors, then preferred and finally common stockholders (04-debt.md §3.2.3 liquidation priority). Stockholders are owners, not lenders, and stand last in line.", "calc": false, "source": "04-debt.md §3.2.3"}, {"id": "debt-L1-05", "domain": "debt", "level": 1, "topic": "laddering-intuition", "module": "M12", "stem": "A retiree splits her savings evenly among bonds that come due one, two, three, four and five years from now. Each time one matures she buys a new five-year bond. What is the MAIN benefit of this approach?", "options": ["It guarantees the highest possible return", "Some money comes due every year, so she is never locked into a single interest rate and always has cash coming available", "It removes the risk that any issuer fails to pay", "It avoids income tax on the interest"], "answer": 1, "explanation": "This is a bond ladder: staggered maturities average out reinvestment risk and provide regular liquidity at a moderate yield, the default conservative-retiree strategy (04-debt.md §3.15). It does not maximize return, eliminate default risk or change taxation.", "calc": false, "source": "04-debt.md §3.15"}, {"id": "debt-L2-01", "domain": "debt", "level": 2, "topic": "debenture-definition", "module": "M12", "stem": "A corporate bond that is backed only by the issuer's general promise to pay, with no specific assets pledged as collateral, is a:", "options": ["Mortgage bond", "Equipment trust certificate", "Debenture", "Collateral trust bond"], "answer": 2, "explanation": "Debentures are unsecured and backed by the issuer's full faith and credit; mortgage bonds, equipment trust certificates and collateral trust bonds are all secured by specific pledged assets (04-debt.md §3.2.1-3.2.2).", "calc": false, "source": "04-debt.md §3.2.2"}, {"id": "debt-L2-02", "domain": "debt", "level": 2, "topic": "gnma-full-faith-and-credit", "module": "M12", "stem": "Which of the following agency securities is backed by the full faith and credit of the U.S. government?", "options": ["Ginnie Mae (GNMA) pass-through certificates", "Fannie Mae (FNMA) mortgage-backed securities", "Freddie Mac (FHLMC) mortgage-backed securities", "Federal Home Loan Bank debentures"], "answer": 0, "explanation": "GNMA is a government corporation within HUD and its pass-throughs are the only MBS carrying the full faith and credit of the U.S. government; FNMA and FHLMC are GSEs with implicit backing and FHLB is a GSE lender (04-debt.md §3.10.1-3.10.3).", "calc": false, "source": "04-debt.md §3.10.1"}, {"id": "debt-L2-03", "domain": "debt", "level": 2, "topic": "treasury-interest-taxation", "module": "M12", "stem": "Interest received on a U.S. Treasury note is:", "options": ["Exempt from federal income tax but subject to state income tax", "Subject to federal, state and local income tax", "Exempt from federal, state and local income tax", "Subject to federal income tax but exempt from state and local income tax"], "answer": 3, "explanation": "Treasury interest is federally taxable and exempt from state and local tax; the reverse-attribute distractor (federal-exempt, state-taxable) describes nothing, and fully taxable describes GNMA/FNMA/FHLMC and corporates (04-debt.md §3.9, §3.17).", "calc": false, "source": "04-debt.md §3.9"}, {"id": "debt-L2-04", "domain": "debt", "level": 2, "topic": "commercial-paper", "module": "M12", "stem": "Commercial paper is BEST described as:", "options": ["A bank-guaranteed time draft used to finance imports and exports", "An unsecured short-term promissory note issued by a corporation, with a maximum maturity of 270 days", "A short-term note secured by the issuer's real property", "A bank time deposit that pays interest at maturity"], "answer": 1, "explanation": "Commercial paper is unsecured corporate paper sold at a discount with maturities of 270 days or less, which keeps it exempt from 1933 Act registration (04-debt.md §3.12). The time draft is a banker's acceptance and the interest-paying deposit is a negotiable CD.", "calc": false, "source": "04-debt.md §3.12"}, {"id": "debt-L2-05", "domain": "debt", "level": 2, "topic": "inverted-yield-curve", "module": "M25", "stem": "When short-term Treasury yields are higher than long-term Treasury yields, the yield curve is described as:", "options": ["Normal", "Flat", "Inverted", "Humped"], "answer": 2, "explanation": "An inverted (negative) curve has short rates above long rates, typically during Fed tightening when markets expect cuts; a normal curve slopes upward, a flat curve shows little difference and a humped curve peaks at intermediate maturities (04-debt.md §3.14).", "calc": false, "source": "04-debt.md §3.14"}, {"id": "debt-L3-01", "domain": "debt", "level": 3, "topic": "corporate-quote-eighths", "module": "M23", "stem": "A corporate bond is quoted at 98 3/8. What is the dollar price of one bond?", "options": ["$980.94", "$983.75", "$983.30", "$98.38"], "answer": 1, "explanation": "Corporate bonds are quoted as a percentage of $1,000 par in eighths: 3/8 = 0.375, so 98.375% x $1,000 = $983.75 (04-debt.md §3.4.1). $980.94 applies Treasury 32nds; $98.38 forgets to multiply by $1,000.", "calc": true, "source": "04-debt.md §3.4.1"}, {"id": "debt-L3-02", "domain": "debt", "level": 3, "topic": "treasury-quote-32nds", "module": "M23", "stem": "A Treasury bond is quoted at 101-12. What is the dollar price of one bond?", "options": ["$1,011.20", "$1,012.00", "$1,013.75", "$1,015.00"], "answer": 2, "explanation": "Treasury notes and bonds are quoted in 32nds: 101-12 = 101 + 12/32 = 101.375% of $1,000 = $1,013.75 (04-debt.md §3.4.2). $1,011.20 reads the quote as the decimal 101.12%; $1,015.00 would be 101-16 (a half point), not 101-12; $1,012.00 treats the 12 as $12.", "calc": true, "source": "04-debt.md §3.4.2"}, {"id": "debt-L3-03", "domain": "debt", "level": 3, "topic": "current-yield", "module": "M23", "stem": "A 6% corporate bond is trading at 90. What is its current yield?", "options": ["6.67%", "6.00%", "5.40%", "7.37%"], "answer": 0, "explanation": "Current yield = annual interest / market price = $60 / $900 = 6.67% (04-debt.md §3.5.2). 6.00% is the nominal yield and 7.37% is the approximate 10-year YTM, both distractors.", "calc": true, "source": "04-debt.md §3.5.2"}, {"id": "debt-L3-04", "domain": "debt", "level": 3, "topic": "investment-grade-floor", "module": "M23", "stem": "Which of the following is the LOWEST rating that is still considered investment grade by Standard & Poor's?", "options": ["A-", "BB+", "BBB", "BBB-"], "answer": 3, "explanation": "Investment grade covers the top four categories, down to and including BBB- (S&P/Fitch) or Baa3 (Moody's); BB+ and below is high-yield (04-debt.md §3.8.1).", "calc": false, "source": "04-debt.md §3.8.1"}, {"id": "debt-L3-05", "domain": "debt", "level": 3, "topic": "duration-price-approximation", "module": "M23", "stem": "A bond has a duration of 7. If market interest rates rise by 1%, the bond's price will most likely:", "options": ["Fall by approximately 7%", "Rise by approximately 7%", "Fall by approximately 1%", "Fall by approximately 14%"], "answer": 0, "explanation": "Percentage price change is approximately -duration x change in yield: -7 x 1% = -7% (a $1,000 bond to about $930) (04-debt.md §3.7.2). Direction is inverse; magnitude is the duration, not 1% or double.", "calc": true, "source": "04-debt.md §3.7.2"}, {"id": "debt-L4-01", "domain": "debt", "level": 4, "topic": "accrued-interest-corporate-30-360", "module": "M24", "stem": "An 8% corporate bond pays interest on January 15 and July 15. A customer buys one bond ($1,000 par) on Tuesday, March 10, 2026, with regular-way settlement. How much accrued interest does the buyer pay the seller?", "options": ["$11.11", "$12.22", "$12.44", "$12.67"], "answer": 2, "explanation": "Regular way is T+1, so settlement is Wednesday March 11, 2026. Using 30/360, count January 15 up to but not including March 11: 16 (Jan) + 30 (Feb) + 10 (Mar) = 56 days; $80 x 56/360 = $12.44 (04-debt.md §3.6.4). $12.67 counts 57 days by including the settlement date; $12.22 uses 55 days.", "calc": true, "source": "04-debt.md §3.6.4"}, {"id": "debt-L4-02", "domain": "debt", "level": 4, "topic": "convertible-parity-arbitrage", "module": "M24", "stem": "A 5% convertible bond with a conversion price of $25 is trading at $1,080. The issuer's common stock is trading at $28. What arbitrage profit per bond, before commissions, is available?", "options": ["$40", "$80", "$120", "None, because the bond is trading above parity"], "answer": 0, "explanation": "Conversion ratio = $1,000 / $25 = 40 shares; parity price of the bond = $28 x 40 = $1,120. The bond at $1,080 is below parity, so buy the bond, convert and sell 40 shares at $28 for $1,120, a $40 profit (04-debt.md §3.3.1-3.3.2). The coupon is a distractor.", "calc": true, "source": "04-debt.md §3.3.2"}, {"id": "debt-L4-03", "domain": "debt", "level": 4, "topic": "yield-to-call-approximation", "module": "M23", "stem": "A 6% bond with 10 years to maturity is purchased at $1,100. It is callable in 5 years at 103. Using the exam approximation method, the yield to call is closest to:", "options": ["4.76%", "4.32%", "5.45%", "6.00%"], "answer": 1, "explanation": "YTC = [annual interest + (call price - purchase price) / years to call] / [(call price + purchase price) / 2] = [$60 + ($1,030 - $1,100)/5] / [($1,030 + $1,100)/2] = $46 / $1,065 = 4.32% (04-debt.md §3.5.4). 4.76% is the approximate YTM and 5.45% the current yield; on a premium bond YTC is the lowest.", "calc": true, "source": "04-debt.md §3.5.4"}, {"id": "debt-L4-04", "domain": "debt", "level": 4, "topic": "tips-inflation-adjustment", "module": "M25", "stem": "An investor buys a $1,000 Treasury Inflation-Protected Security with a 3% coupon. Over the first year the CPI rises 4%. Approximately how much interest will the investor receive for that year?", "options": ["$30.00", "$40.00", "$70.00", "$31.20"], "answer": 3, "explanation": "TIPS keep the coupon rate fixed and adjust the principal for CPI: $1,000 x 1.04 = $1,040 adjusted principal, and 3% of $1,040 = $31.20 (04-debt.md §3.9.4). The inflation adjustment raises principal (taxed annually as phantom income), not the coupon rate.", "calc": true, "source": "04-debt.md §3.9.4"}, {"id": "debt-L4-05", "domain": "debt", "level": 4, "topic": "t-bill-discount-yield-calc", "module": "M23", "stem": "A 182-day Treasury bill is purchased at $97.50 per $100 of face value. What is its annualized discount yield?", "options": ["2.50%", "4.95%", "5.14%", "5.00%"], "answer": 1, "explanation": "Discount yield = (par - price) / par x 360 / days = (100 - 97.50) / 100 x 360 / 182 = 4.95% (04-debt.md §3.4.3). 5.14% is the bond-equivalent yield (divides by price and uses 365 days); 2.50% is the unannualized discount.", "calc": true, "source": "04-debt.md §3.4.3"}, {"id": "debt-L5-01", "domain": "debt", "level": 5, "topic": "premium-bond-yield-ordering-call-above-market", "module": "M23", "stem": "A 5% corporate bond with 10 years to maturity is trading at 102. It is callable in 5 years at 103. Using the exam approximation formulas, which of the bond's yields is the LOWEST?", "options": ["Nominal yield", "Current yield", "Yield to maturity", "Yield to call"], "answer": 2, "explanation": "Current yield = $50 / $1,020 = 4.90%. YTM = [$50 + ($1,000 - $1,020)/10] / [($1,000 + $1,020)/2] = $48 / $1,010 = 4.75%. YTC = [$50 + ($1,030 - $1,020)/5] / [($1,030 + $1,020)/2] = $52 / $1,025 = 5.07%. The memorized rule 'premium bond: nominal > CY > YTM > YTC' assumes a call at or near par. Here the call price (103) is ABOVE the market price (102), so a call hands the holder a gain instead of a loss and YTC becomes the HIGHEST yield. Ordering: YTC 5.07% > nominal 5.00% > CY 4.90% > YTM 4.75%, so YTM is lowest (04-debt.md §3.5.3-3.5.6).", "calc": true, "source": "04-debt.md §3.5.4, §3.5.6"}, {"id": "debt-L5-02", "domain": "debt", "level": 5, "topic": "cmo-io-tranche-behavior", "module": "M25", "stem": "Which of the following CMO tranches would be expected to INCREASE in value when market interest rates rise?", "options": ["Principal-only (PO) tranche", "Planned amortization class (PAC) tranche", "Interest-only (IO) tranche", "Z (accrual) tranche"], "answer": 2, "explanation": "Rising rates slow prepayments, so the mortgage interest stream lasts longer and the IO tranche gains value; it is the one bond-like security whose price moves with rates (04-debt.md §3.11.2). POs benefit from faster prepayments, and PAC and Z tranches lose value like ordinary bonds.", "calc": false, "source": "04-debt.md §3.11.2"}, {"id": "debt-L5-03", "domain": "debt", "level": 5, "topic": "gnma-except", "module": "M25", "stem": "All of the following statements about Ginnie Mae (GNMA) pass-through certificates are true EXCEPT:", "options": ["They are backed by the full faith and credit of the U.S. government", "Investors receive monthly payments of both interest and principal", "The underlying pools consist of FHA, VA or USDA-insured mortgages", "Interest received is exempt from state and local income taxes"], "answer": 3, "explanation": "GNMA interest is fully taxable at the federal, state and local levels; only Treasuries and the FHLB/FFCB/TVA lenders get the state exemption (04-debt.md §3.10.1, §3.17). The other three statements are the classic true attributes of GNMA pass-throughs.", "calc": false, "source": "04-debt.md §3.10.1"}, {"id": "debt-L5-04", "domain": "debt", "level": 5, "topic": "t-bill-bid-ask-inversion", "module": "M23", "stem": "A dealer quotes a Treasury bill as bid 4.30, ask 4.25. Which of the following statements is TRUE?", "options": ["The bid represents a lower dollar price than the ask, because T-bills are quoted on a discount-yield basis", "The bid represents a higher dollar price than the ask, as with any other security", "A customer buying the bill from the dealer will pay a price based on the 4.30 yield", "The quote is expressed as a percentage of par in 32nds"], "answer": 0, "explanation": "T-bills are quoted as annualized discount yields, so the higher number is the lower dollar price; the dealer bids to buy at the higher yield (lower price) and offers at the lower yield (04-debt.md §3.4.3). A customer buys at the ask, 4.25, and 32nds apply to notes and bonds, not bills.", "calc": false, "source": "04-debt.md §3.4.3"}, {"id": "debt-L5-05", "domain": "debt", "level": 5, "topic": "accrued-interest-treasury-day-count", "module": "M24", "stem": "A 4% Treasury note pays interest on February 15 and August 15. A customer buys the note on Tuesday, March 10, 2026, for regular-way settlement. How many days of accrued interest will the buyer pay?", "options": ["27", "26", "25", "24"], "answer": 3, "explanation": "Treasuries settle T+1 (Wednesday March 11) and accrue on actual calendar days from the last coupon up to but not including settlement: February 15-28 = 14 days, plus March 1-10 = 10 days, for 24 days (04-debt.md §3.6.5). 26 applies the corporate 30/360 count to a Treasury; 25 and 27 wrongly include the settlement date.", "calc": true, "source": "04-debt.md §3.6.5"}, {"id": "eq-L1-01", "domain": "equity", "level": 1, "topic": "share-ownership", "module": "M11", "stem": "When you buy one share of a company's stock, what have you actually bought?", "options": ["A loan to the company that it must repay with interest on a set date", "A small piece of ownership in the company", "A guaranteed yearly payment from the company", "The right to be hired as an employee of the company"], "answer": 1, "explanation": "A share of stock is a unit of ownership (equity) in the corporation; a loan with a promised repayment date describes a bond, and dividends are never guaranteed. See 03-equity.md §2 and §3.1.3.", "calc": false, "source": "03-equity.md §2, §3.1.3"}, {"id": "eq-L1-02", "domain": "equity", "level": 1, "topic": "dividend-basics", "module": "M11", "stem": "A company you own stock in announces that it will pay a dividend. What does that mean for you?", "options": ["The company is asking you to lend it more money", "The company is buying your shares back from you", "Your shares are being split into a larger number of shares", "The company is paying you a portion of its profits for each share you own"], "answer": 3, "explanation": "A dividend is a distribution of company profits to shareholders in proportion to the shares they own, paid only if and when the board declares it. A buyback or split is a different corporate action. See 03-equity.md §3.1.3 and §3.7.1.", "calc": false, "source": "03-equity.md §3.1.3, §3.7.1"}, {"id": "eq-L1-03", "domain": "equity", "level": 1, "topic": "split-total-value", "module": "M11", "stem": "You own 100 shares of a stock trading at $80 each. The company announces a 2-for-1 stock split. Immediately after the split, what do you have?", "options": ["200 shares worth about $40 each, about $8,000 in total", "200 shares worth $80 each, about $16,000 in total", "100 shares worth $160 each, about $16,000 in total", "50 shares worth $160 each, about $8,000 in total"], "answer": 0, "explanation": "A forward split gives you more shares at a proportionally lower price, so the total value ($8,000) and total cost basis are unchanged; a split does not create value. See 03-equity.md §3.8.", "calc": true, "source": "03-equity.md §3.8"}, {"id": "eq-L1-04", "domain": "equity", "level": 1, "topic": "preferred-priority", "module": "M11", "stem": "A company has both preferred stock and common stock. Compared with a common stockholder, a preferred stockholder generally:", "options": ["Has more votes at shareholder meetings", "Shares fully in all of the company's future growth in profits", "Receives a fixed dividend before common stockholders receive anything", "Can require the company to buy the shares back at any time"], "answer": 2, "explanation": "Preferred stock pays a fixed dividend and has priority over common for dividends and in liquidation, but usually has no vote and no share in earnings growth. See 03-equity.md §3.2.1.", "calc": false, "source": "03-equity.md §3.2.1"}, {"id": "eq-L1-05", "domain": "equity", "level": 1, "topic": "limited-liability", "module": "M11", "stem": "You paid $2,000 for shares of a company. The company later goes bankrupt and its stock becomes worthless. What is the most you can lose?", "options": ["The $2,000 plus your share of the company's unpaid debts", "The $2,000 you paid for the shares", "Nothing, because the company must refund shareholders before paying creditors", "The $2,000 plus any dividends you received in the past"], "answer": 1, "explanation": "Stockholders have limited liability: they can lose only what they invested and are never responsible for corporate debts. Creditors are paid before shareholders, not after, so a refund is not available. See 03-equity.md §3.1.3.", "calc": false, "source": "03-equity.md §3.1.3"}, {"id": "eq-L2-01", "domain": "equity", "level": 2, "topic": "treasury-stock", "module": "M11", "stem": "A corporation repurchases some of its previously issued shares and holds them as treasury stock. These treasury shares:", "options": ["Continue to vote and receive dividends until they are cancelled", "Are no longer counted as issued shares", "Carry no voting rights and receive no dividends", "Increase the number of shares outstanding"], "answer": 2, "explanation": "Treasury stock is issued but not outstanding: it has no vote, receives no dividends and is excluded from EPS. The trap is that it remains counted as issued (outstanding = issued minus treasury). See 03-equity.md §3.1.1.", "calc": false, "source": "03-equity.md §3.1.1"}, {"id": "eq-L2-02", "domain": "equity", "level": 2, "topic": "warrants-vs-rights", "module": "M11", "stem": "Which of the following is TRUE of warrants but NOT of stock rights?", "options": ["The exercise price is typically set above the stock's market price when issued", "Holders receive dividends on the underlying stock", "They are issued to existing shareholders so they can maintain proportionate ownership", "They typically expire within 30 to 90 days"], "answer": 0, "explanation": "Warrants are long-term sweeteners issued with an exercise price above market, so they have only time value at issue; rights are short-lived, issued to existing holders below market. Neither pays dividends. See 03-equity.md §3.4 comparison table.", "calc": false, "source": "03-equity.md §3.4"}, {"id": "eq-L2-03", "domain": "equity", "level": 2, "topic": "adr-currency-risk", "module": "M11", "stem": "An investor buys an American Depositary Receipt (ADR) representing shares of a Japanese company. Which of the following statements is TRUE?", "options": ["Dividends are paid to the investor in Japanese yen", "The investor has no exposure to changes in the yen-dollar exchange rate", "The ADR can be traded only on the Tokyo exchange", "Dividends are paid in U.S. dollars, but the investor still bears currency risk"], "answer": 3, "explanation": "ADRs trade and pay dividends in U.S. dollars, yet because the underlying shares and dividends are denominated in yen, a weaker yen reduces the dollar value of both. See 03-equity.md §3.5.", "calc": false, "source": "03-equity.md §3.5"}, {"id": "eq-L2-04", "domain": "equity", "level": 2, "topic": "djia-index", "module": "M18", "stem": "The Dow Jones Industrial Average is BEST described as:", "options": ["A capitalization-weighted index of 500 large U.S. companies", "A price-weighted average of 30 large U.S. companies", "A capitalization-weighted index of about 2,000 small-cap U.S. companies", "An equal-weighted index of essentially all U.S. listed stocks"], "answer": 1, "explanation": "The DJIA is the oldest and narrowest major average: 30 large industrials, price-weighted. The S&P 500 is the cap-weighted 500-stock index and the Russell 2000 is the small-cap benchmark. See 03-equity.md §3.12.", "calc": false, "source": "03-equity.md §3.12"}, {"id": "eq-L2-05", "domain": "equity", "level": 2, "topic": "defensive-stocks", "module": "M11", "stem": "A customer wants stocks whose earnings tend to hold up even during a recession. Which category of stock BEST fits this objective?", "options": ["Cyclical stocks such as automakers and steel producers", "Speculative stocks such as early-stage biotech companies", "Growth stocks that reinvest all of their earnings", "Defensive stocks such as food producers and utilities"], "answer": 3, "explanation": "Defensive (non-cyclical) stocks sell goods with stable demand regardless of the economy; cyclical stocks are the opposite, tracking the business cycle. See 03-equity.md §3.1.5.", "calc": false, "source": "03-equity.md §3.1.5"}, {"id": "eq-L3-01", "domain": "equity", "level": 3, "topic": "ex-dividend-date-t1", "module": "M17", "stem": "A corporation declares a regular quarterly cash dividend with a record date of Thursday, March 12. No holidays fall that week. Under current regular-way settlement rules, the ex-dividend date is:", "options": ["Thursday, March 12", "Wednesday, March 11", "Tuesday, March 10", "Friday, March 13"], "answer": 0, "explanation": "Since T+1 settlement took effect on 2024-05-28, FINRA Rule 11140 sets the ex-dividend date for regular distributions equal to the record date (a purchase on the record date settles one day too late). The last day to buy and receive the dividend is Wednesday, March 11; the older one- or two-days-before rules are stale. See 03-equity.md §3.7.3.", "calc": false, "source": "03-equity.md §3.7.3"}, {"id": "eq-L3-02", "domain": "equity", "level": 3, "topic": "dividends-in-arrears", "module": "M17", "stem": "A corporation's 5% $100-par cumulative preferred stock has paid no dividends for the past two years. Before the company can pay any dividend on its common stock this year, each preferred share must receive:", "options": ["$5", "$10", "$15", "$20"], "answer": 2, "explanation": "Cumulative preferred must receive all arrears plus the current year's dividend before common is paid: $5 + $5 (two skipped years) + $5 (current year) = $15. Forgetting the current year gives the $10 distractor. See 03-equity.md §3.2.2.", "calc": true, "source": "03-equity.md §3.2.2"}, {"id": "eq-L3-03", "domain": "equity", "level": 3, "topic": "stock-dividend-basis", "module": "M17", "stem": "An investor owns 200 shares of XYZ purchased at $60 per share. XYZ distributes a 20% stock dividend. After the distribution, the investor's cost basis per share is:", "options": ["$60.00", "$50.00", "$48.00", "$72.00"], "answer": 1, "explanation": "Total basis is unchanged at $12,000; shares rise to 200 x 1.20 = 240, so per-share basis is $12,000 / 240 = $50. Multiplying $60 by 0.8 ($48) is the classic error. See 03-equity.md §3.8.", "calc": true, "source": "03-equity.md §3.8"}, {"id": "eq-L3-04", "domain": "equity", "level": 3, "topic": "dividend-yield", "module": "M18", "stem": "ABC common stock pays a quarterly dividend of $0.45 per share and currently trades at $30. Its current dividend yield is:", "options": ["1.5%", "4.5%", "0.6%", "6.0%"], "answer": 3, "explanation": "Current yield uses the annual dividend: $0.45 x 4 = $1.80, and $1.80 / $30 = 6.0%. Dividing the quarterly amount by price gives the 1.5% distractor. See 03-equity.md §3.7.7.", "calc": true, "source": "03-equity.md §3.7.7"}, {"id": "eq-L3-05", "domain": "equity", "level": 3, "topic": "head-and-shoulders", "module": "M18", "stem": "A technical analyst observes that a stock in a long uptrend has formed a head-and-shoulders top and has just broken below the neckline. The analyst would MOST likely regard this as:", "options": ["A bearish signal indicating a reversal of the uptrend", "A bullish signal indicating the uptrend will continue", "A consolidation pattern with no directional implication", "A sign the stock is oversold and due for a bounce"], "answer": 0, "explanation": "A head-and-shoulders top is a bearish reversal pattern; the break below the neckline confirms the sell signal. Only the inverted head-and-shoulders (bottom) is bullish. See 03-equity.md §3.14.2.", "calc": false, "source": "03-equity.md §3.14.2"}, {"id": "eq-L4-01", "domain": "equity", "level": 4, "topic": "cumulative-voting", "module": "M17", "stem": "A shareholder owns 300 shares of a company that uses cumulative voting. Four directors are to be elected at the annual meeting. What is the maximum number of votes the shareholder may cast for a single candidate?", "options": ["75", "300", "400", "1,200"], "answer": 3, "explanation": "Total votes = shares x seats = 300 x 4 = 1,200, and cumulative voting lets the holder concentrate all of them on one candidate. Under statutory voting the maximum per candidate would be 300 (the distractor). See 03-equity.md §3.1.4.", "calc": true, "source": "03-equity.md §3.1.4"}, {"id": "eq-L4-02", "domain": "equity", "level": 4, "topic": "conversion-parity", "module": "M17", "stem": "A $100-par convertible preferred stock is convertible into common at $20 per share and is currently trading at $110. The parity price of the common stock is:", "options": ["$20", "$22", "$27.50", "$550"], "answer": 1, "explanation": "Conversion ratio = par / conversion price = $100 / $20 = 5 shares; parity price of common = preferred price / ratio = $110 / 5 = $22. Using the conversion price itself ($20) ignores the preferred's premium over par. See 03-equity.md §3.2.3.", "calc": true, "source": "03-equity.md §3.2.3"}, {"id": "eq-L4-03", "domain": "equity", "level": 4, "topic": "cum-rights-value", "module": "M17", "stem": "XYZ common stock trades at $44. The company offers existing shareholders new shares at $36, with 3 rights required to purchase one new share. Before the ex-rights date, the theoretical value of one right is:", "options": ["$2.67", "$8.00", "$2.00", "$1.33"], "answer": 2, "explanation": "Cum-rights (before the ex-date) value = (market - subscription) / (rights needed + 1) = ($44 - $36) / (3 + 1) = $2.00. Omitting the +1 gives the ex-rights answer of $2.67, the classic trap. See 03-equity.md §3.3.", "calc": true, "source": "03-equity.md §3.3"}, {"id": "eq-L4-04", "domain": "equity", "level": 4, "topic": "rule144-volume", "module": "M17", "stem": "An officer of a company with 12,000,000 common shares outstanding files Form 144 to sell control stock. Trading volume during the four calendar weeks preceding the filing was 150,000, 130,000, 140,000 and 140,000 shares. The maximum number of shares the officer may sell under Rule 144 during the next three months is:", "options": ["140,000", "120,000", "150,000", "560,000"], "answer": 0, "explanation": "Rule 144(e) allows the GREATER of 1% of outstanding shares (120,000) or the average weekly volume of the preceding four weeks (560,000 / 4 = 140,000), so 140,000. Picking 1% or the single highest week are the common errors. See 03-equity.md §3.9.", "calc": true, "source": "03-equity.md §3.9"}, {"id": "eq-L4-05", "domain": "equity", "level": 4, "topic": "book-value-per-share", "module": "M18", "stem": "For this question, book value per share = (total stockholders' equity - preferred stock at par - intangible assets) / common shares outstanding. A company reports total stockholders' equity of $5,000,000, preferred stock of $500,000 at par, intangible assets of $300,000 and 400,000 common shares outstanding. Its book value per share is:", "options": ["$12.50", "$11.25", "$10.50", "$11.75"], "answer": 2, "explanation": "($5,000,000 - $500,000 - $300,000) / 400,000 = $4,200,000 / 400,000 = $10.50. Forgetting to remove preferred gives $11.75 and forgetting intangibles gives $11.25; the definition is stated in the stem because providers differ on the intangibles adjustment (00-curriculum.md §7 item 16). See 03-equity.md §3.13.4.", "calc": true, "source": "03-equity.md §3.13.4"}, {"id": "eq-L5-01", "domain": "equity", "level": 5, "topic": "rule144-control-stock", "module": "M17", "stem": "The chief financial officer of an SEC-reporting company purchased 8,000 shares of her company's common stock in the open market on the NYSE two months ago. She now wishes to sell them. Which of the following statements is TRUE?", "options": ["She must hold the shares for six months before selling under Rule 144", "She may sell immediately, but the sale is subject to Rule 144 volume limits and a Form 144 filing", "She may sell without any Rule 144 restrictions because the shares were bought in the open market", "She must hold the shares for one year because she is an affiliate"], "answer": 1, "explanation": "Shares owned by an affiliate are control stock: the Rule 144 holding period applies only to restricted (unregistered) stock, so open-market shares may be sold at once, but the affiliate's sales remain subject to the volume limit and, because 8,000 exceeds 5,000 shares, a Form 144 notice. See 03-equity.md §3.9 and §4 traps.", "calc": false, "source": "03-equity.md §3.9"}, {"id": "eq-L5-02", "domain": "equity", "level": 5, "topic": "large-distribution-ex-date", "module": "M17", "stem": "A corporation declares a 30% stock dividend with a record date of Wednesday, June 10, and a payable date of Wednesday, June 24. All dates are business days. The ex-dividend date is:", "options": ["Wednesday, June 10", "Tuesday, June 9", "Wednesday, June 24", "Thursday, June 25"], "answer": 3, "explanation": "For distributions of 25% or more of the security's value, FINRA Rule 11140(b)(2) sets the ex-date as the first business day AFTER the payable date, so June 25; trades between record and payable dates carry due bills. The record-date answer applies only to regular distributions under T+1. See 03-equity.md §3.7.3 and §3.7.4.", "calc": false, "source": "03-equity.md §3.7.3"}, {"id": "eq-L5-03", "domain": "equity", "level": 5, "topic": "working-capital-except", "module": "M18", "stem": "All of the following transactions change a corporation's working capital EXCEPT:", "options": ["Paying off accounts payable with cash", "Declaring and paying a cash dividend to common stockholders", "Issuing long-term bonds for cash", "Purchasing manufacturing equipment with cash"], "answer": 0, "explanation": "Working capital = current assets - current liabilities; paying a current liability with cash reduces both sides equally, so the difference is unchanged. Declaring and paying a cash dividend and buying equipment for cash both send cash out with no offsetting drop in current liabilities, so working capital falls; a long-term bond issue brings in cash against a long-term liability, so it rises. See 03-equity.md §3.13.4.", "calc": false, "source": "03-equity.md §3.13.4"}, {"id": "eq-L5-04", "domain": "equity", "level": 5, "topic": "forced-conversion", "module": "M17", "stem": "A $100-par 6% preferred stock is convertible at $20 and callable at $103. The company has just announced that it will call the entire issue. The preferred trades at $104 and the common at $21.50. Which action produces the greatest value for a preferred holder?", "options": ["Accept the call and receive $103 per share", "Sell the preferred in the market at $104", "Convert to common and sell the common shares", "Hold the preferred and continue collecting the 6% dividend"], "answer": 2, "explanation": "Conversion ratio = $100 / $20 = 5 shares, so converting yields 5 x $21.50 = $107.50, more than the $104 market price or the $103 call price. Holding is not an option once the issue is called. See 03-equity.md §3.2.3 forced-conversion example.", "calc": true, "source": "03-equity.md §3.2.3"}, {"id": "eq-L5-05", "domain": "equity", "level": 5, "topic": "contrarian-indicators-except", "module": "M18", "stem": "A technical analyst would regard all of the following as bullish indicators EXCEPT:", "options": ["High and rising short interest", "Heavy buying by odd-lot investors", "A high put/call ratio", "A breakout above a resistance level on heavy volume"], "answer": 1, "explanation": "Odd-lot theory is contrarian: small investors are assumed wrong at extremes, so heavy odd-lot buying is bearish. High short interest (future buying) and a high put/call ratio (crowd fear) are contrarian bullish signals, and an upside breakout is directly bullish. See 03-equity.md §3.14.3.", "calc": false, "source": "03-equity.md §3.14.3"}, {"id": "fnd-L1-01", "domain": "foundations", "level": 1, "topic": "what-a-stock-is", "module": "M2", "stem": "When you buy one share of a company's stock, what have you actually bought?", "options": ["A loan to the company that it must repay to you with interest", "A small piece of ownership in the company", "A promise that the company will buy the share back from you at a set price", "A fixed yearly payment that the company guarantees"], "answer": 1, "explanation": "Stock is equity: a slice of ownership with a residual claim, and dividends are never guaranteed. A loan repaid with interest describes a bond, not a share. (02-foundations.md §3.A.1, §3.A.3)", "calc": false, "source": "02-foundations.md §3.A.3"}, {"id": "fnd-L1-02", "domain": "foundations", "level": 1, "topic": "percent-change", "module": "M1", "stem": "A share you bought for $40 is now worth $50. By what percentage has its price increased?", "options": ["10%", "20%", "25%", "125%"], "answer": 2, "explanation": "Percent change = (new − old) ÷ old = (50 − 40) ÷ 40 = 25%. Dividing by the new price ($10 ÷ $50 = 20%) is the classic asymmetry error. (02-foundations.md §3.J.1)", "calc": true, "source": "02-foundations.md §3.J.1"}, {"id": "fnd-L1-03", "domain": "foundations", "level": 1, "topic": "why-bond-prices-fall-when-rates-rise", "module": "M7", "stem": "You own a bond that pays $40 a year on every $1,000 invested. Newly issued bonds of the same quality now pay $60 a year per $1,000. If you want to sell your bond today, what must happen?", "options": ["You must accept less than $1,000, so the buyer's return catches up to what new bonds pay", "You can ask for more than $1,000, because your bond is older and proven", "You will get exactly $1,000, because the bond's face value never changes", "You cannot sell it until it matures"], "answer": 0, "explanation": "Nobody pays full price for $40 a year when $60 a year is available, so the price of the existing bond drops until its yield matches the market — the price/yield seesaw. Face value is what the issuer repays at maturity, not what a buyer pays today. (02-foundations.md §3.H.4, §3.G.3)", "calc": false, "source": "02-foundations.md §3.H.4"}, {"id": "fnd-L1-04", "domain": "foundations", "level": 1, "topic": "compound-interest", "module": "M1", "stem": "You put $1,000 in an account that pays 10% interest once a year, and the interest is left in the account to earn interest itself. How much is in the account after two years?", "options": ["$1,100", "$1,200", "$1,220", "$1,210"], "answer": 3, "explanation": "Compounding: $1,000 × 1.10 × 1.10 = $1,210 — the second year's 10% is earned on $1,100, not $1,000. $1,200 is simple interest (interest on principal only). (02-foundations.md §3.G.2)", "calc": true, "source": "02-foundations.md §3.G.2"}, {"id": "fnd-L1-05", "domain": "foundations", "level": 1, "topic": "inflation-purchasing-power", "module": "M9", "stem": "Your savings account pays 2% a year. Over the same year, the prices of the things you buy rise by 3%. What happens to what your savings can buy?", "options": ["It grows, because the account balance is larger than a year ago", "It shrinks, because prices rose faster than the balance grew", "It stays the same, because the interest offsets the price increases", "It shrinks by exactly 3%, because interest does not count against inflation"], "answer": 1, "explanation": "Real return = nominal rate − inflation = 2% − 3% = about −1%, so purchasing power falls even though the dollar balance rose. The interest does count; it just does not fully offset the 3% price rise. (02-foundations.md §3.F.2)", "calc": false, "source": "02-foundations.md §3.F.2"}, {"id": "fnd-L2-01", "domain": "foundations", "level": 2, "topic": "primary-vs-secondary-market", "module": "M3", "stem": "An investor buys 100 shares of XYZ common stock on the New York Stock Exchange. Who receives the money the investor pays?", "options": ["XYZ Corporation, the issuer of the shares", "The New York Stock Exchange", "Another investor who sold the shares", "The underwriter that originally brought XYZ public"], "answer": 2, "explanation": "An exchange trade is a secondary-market transaction: investors trade with each other and the issuer receives nothing. The issuer is paid only in the primary market (an IPO or follow-on offering). (02-foundations.md §3.B.2)", "calc": false, "source": "02-foundations.md §3.B.2"}, {"id": "fnd-L2-02", "domain": "foundations", "level": 2, "topic": "broker-vs-dealer-compensation", "module": "M4", "stem": "A broker-dealer fills a customer's buy order by selling shares out of its own inventory. In this trade the firm is compensated by:", "options": ["A markup built into the price the customer pays", "A commission disclosed separately on the confirmation", "A commission plus a markup on the same trade", "A management fee based on the customer's assets"], "answer": 0, "explanation": "Selling from inventory is acting as a dealer (principal), which is compensated by a markup; a commission is the broker (agent) capacity. A firm may not charge both on a single trade. (02-foundations.md §3.C.1)", "calc": false, "source": "02-foundations.md §3.C.1"}, {"id": "fnd-L2-03", "domain": "foundations", "level": 2, "topic": "fdic-vs-sipc-coverage", "module": "M6", "stem": "Which of the following is protected by FDIC insurance?", "options": ["Shares of a stock mutual fund purchased at a bank branch", "Common stock held in a brokerage account", "A variable annuity sold by a bank's registered representative", "A 12-month certificate of deposit issued by an FDIC-member bank"], "answer": 3, "explanation": "FDIC insures bank deposits (checking, savings, CDs) up to $250,000 per depositor, per bank, per ownership category. It never covers securities — mutual funds, stocks or annuities — even when bought at a bank, which is why the 'not FDIC insured / may lose value' disclosure is required. (02-foundations.md §3.D.7)", "calc": false, "source": "02-foundations.md §3.D.7"}, {"id": "fnd-L2-04", "domain": "foundations", "level": 2, "topic": "regular-way-settlement", "module": "M5", "stem": "A customer buys shares of a listed common stock in a regular-way transaction. When does the trade settle?", "options": ["The same business day as the trade", "One business day after the trade date", "Two business days after the trade date", "Three business days after the trade date"], "answer": 1, "explanation": "Since 2024-05-28, regular-way settlement for stocks, corporate and municipal bonds, ETFs and listed options is T+1 under amended SEC Rule 15c6-1. T+2 is the pre-2024 cycle still found in stale prep material; same-day is cash settlement. (02-foundations.md §3.E step 7)", "calc": false, "source": "02-foundations.md §3.E.7"}, {"id": "fnd-L2-05", "domain": "foundations", "level": 2, "topic": "systematic-vs-nonsystematic-risk", "module": "M8", "stem": "Which of the following risks CANNOT be reduced by diversifying a stock portfolio across many issuers and industries?", "options": ["Business risk", "Credit risk", "Market risk", "Liquidity risk"], "answer": 2, "explanation": "Market risk is systematic: it affects the whole market at once and cannot be diversified away (it is measured by beta). Business, credit and liquidity risks are issuer-specific, non-systematic risks that diversification reduces. (02-foundations.md §3.H.2, §3.H.3)", "calc": false, "source": "02-foundations.md §3.H.2"}, {"id": "fnd-L3-01", "domain": "foundations", "level": 3, "topic": "msrb-rules-vs-enforcement", "module": "M6", "stem": "A FINRA member broker-dealer violates an MSRB rule while selling municipal bonds. Which body is responsible for enforcing that rule against the firm?", "options": ["The MSRB", "FINRA", "The state securities administrator", "The municipal issuer"], "answer": 1, "explanation": "The MSRB writes rules for municipal dealers but has no enforcement arm; FINRA enforces MSRB rules against broker-dealers (bank regulators do so for bank dealers). The MSRB cannot regulate issuers at all (Tower Amendment). (02-foundations.md §3.D.3)", "calc": false, "source": "02-foundations.md §3.D.3"}, {"id": "fnd-L3-02", "domain": "foundations", "level": 3, "topic": "current-yield", "module": "M7", "stem": "A corporate bond with a 6% coupon is trading at $1,200. What is its current yield?", "options": ["5.0%", "6.0%", "7.2%", "7.5%"], "answer": 0, "explanation": "Current yield = annual interest ÷ market price = $60 ÷ $1,200 = 5.0%. 6% is the nominal (coupon) yield, which never changes; 7.5% would be the current yield if the bond traded at $800. (02-foundations.md §3.J.4)", "calc": true, "source": "02-foundations.md §3.J.4"}, {"id": "fnd-L3-03", "domain": "foundations", "level": 3, "topic": "open-market-operations-direction", "module": "M9", "stem": "The Federal Open Market Committee directs the sale of Treasury securities in the open market. Which of the following is the MOST likely result?", "options": ["Bank reserves increase and short-term interest rates fall", "The money supply expands and bond prices rise", "Bank reserves increase and bond prices fall", "The money supply contracts and bond prices fall"], "answer": 3, "explanation": "When the Fed sells securities it drains reserves from the banking system (tight money): money supply down, interest rates up, and therefore bond prices down. Buying securities produces the opposite chain. (02-foundations.md §3.F.6; 09-regulation-trading-economics.md §3.14)", "calc": false, "source": "02-foundations.md §3.F.6"}, {"id": "fnd-L3-04", "domain": "foundations", "level": 3, "topic": "corporate-bond-eighths-quote", "module": "M1", "stem": "A corporate bond is quoted at 98 3/8. What is its dollar price?", "options": ["$98.38", "$983.38", "$983.75", "$983.80"], "answer": 2, "explanation": "Corporate and municipal bonds are quoted as a percent of $1,000 par in eighths: 3/8 = 0.375, so 98.375% × $1,000 = $983.75. Reading the fraction as a decimal ($983.38) is the standard error. (02-foundations.md §3.J.3)", "calc": true, "source": "02-foundations.md §3.J.3"}, {"id": "fnd-L3-05", "domain": "foundations", "level": 3, "topic": "quick-ratio", "module": "M10", "stem": "A company reports current assets of $600,000, which include inventory of $150,000, and current liabilities of $300,000. What is its quick (acid-test) ratio?", "options": ["1.5", "2.0", "2.5", "1.0"], "answer": 0, "explanation": "Quick ratio = (current assets − inventory) ÷ current liabilities = ($600,000 − $150,000) ÷ $300,000 = 1.5. 2.0 is the current ratio, which leaves inventory in. (02-foundations.md §3.I.4)", "calc": true, "source": "02-foundations.md §3.I.4"}, {"id": "fnd-L4-01", "domain": "foundations", "level": 4, "topic": "treasury-32nds-price-change", "module": "M1", "stem": "A Treasury note is quoted at 98.16 in the morning and 99.04 at the close. By how many dollars did the price of one $1,000 note change?", "options": ["$0.88", "$8.80", "$6.25", "$18.75"], "answer": 2, "explanation": "Treasury notes and bonds are quoted in 32nds: 98.16 = 98 16/32 = 98.5% = $985.00 and 99.04 = 99 4/32 = 99.125% = $991.25, a change of $6.25. Treating the quotes as decimals gives the $8.80 distractor. (02-foundations.md §3.J.3)", "calc": true, "source": "02-foundations.md §3.J.3"}, {"id": "fnd-L4-02", "domain": "foundations", "level": 4, "topic": "leading-vs-lagging-indicators", "modu
