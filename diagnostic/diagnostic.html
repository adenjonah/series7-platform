le": "M9", "stem": "All of the following are considered leading economic indicators EXCEPT:", "options": ["Average weekly initial claims for unemployment insurance", "New building permits for private housing", "Stock prices as measured by the S&P 500", "Average duration of unemployment"], "answer": 3, "explanation": "Initial jobless claims, building permits and stock prices all turn before the economy and are on the Conference Board's leading index; the average duration of unemployment is a lagging indicator. The trap is that jobless claims lead while unemployment measures lag. (02-foundations.md §3.F.5; 09-regulation-trading-economics.md §3.14)", "calc": false, "source": "02-foundations.md §3.F.5"}, {"id": "fnd-L4-03", "domain": "foundations", "level": 4, "topic": "sipc-coverage-per-capacity", "module": "M6", "stem": "A customer holds $600,000 of securities and $200,000 of cash in an individual account, and $300,000 of securities in a joint account with her spouse, all at the same broker-dealer. The firm fails and is liquidated under SIPC. What is the MAXIMUM amount SIPC will cover for this customer?", "options": ["$500,000", "$800,000", "$1,000,000", "$1,100,000"], "answer": 1, "explanation": "SIPC covers $500,000 per separate customer capacity, of which up to $250,000 may be cash. The individual account ($800,000 claim, $200,000 cash) is capped at $500,000; the joint account is a separate capacity and its $300,000 is fully covered, for $800,000 total. (02-foundations.md §3.D.6)", "calc": true, "source": "02-foundations.md §3.D.6"}, {"id": "fnd-L4-04", "domain": "foundations", "level": 4, "topic": "eps-and-pe-ratio", "module": "M10", "stem": "A corporation reports net income of $8,000,000, pays $800,000 in preferred dividends, and has 3,000,000 common shares outstanding. Its common stock trades at $36. What is the stock's price-to-earnings ratio?", "options": ["15.0", "13.5", "11.3", "22.5"], "answer": 0, "explanation": "EPS = (net income − preferred dividends) ÷ common shares = ($8,000,000 − $800,000) ÷ 3,000,000 = $2.40, and P/E = $36 ÷ $2.40 = 15. Forgetting to subtract the preferred dividends gives EPS of $2.67 and the 13.5 distractor. (02-foundations.md §3.I.7)", "calc": true, "source": "02-foundations.md §3.I.7"}, {"id": "fnd-L4-05", "domain": "foundations", "level": 4, "topic": "reg-t-payment-date", "module": "M5", "stem": "A customer buys 200 shares of a listed stock in a cash account on Thursday, August 20, 2026. Under Regulation T, what is the last day the customer may pay for the purchase without the firm requesting an extension?", "options": ["Friday, August 21", "Monday, August 24", "Tuesday, August 25", "Wednesday, August 26"], "answer": 2, "explanation": "Regular-way settlement is T+1 (Friday, August 21), and Reg T's payment period is settlement plus two business days, so payment is due Tuesday, August 25 (T+3). Wednesday reflects the pre-2024 T+2 cycle plus two days (T+4), which is now stale. (02-foundations.md §3.E step 7)", "calc": true, "source": "02-foundations.md §3.E.7"}, {"id": "fnd-L5-01", "domain": "foundations", "level": 5, "topic": "secondary-offering-is-primary-market", "module": "M3", "stem": "A company that completed its IPO three years ago files a registration statement and sells 2,000,000 newly issued common shares to the public through an underwriting syndicate. Which statement about this transaction is TRUE?", "options": ["It is a secondary market transaction because the company is already publicly traded", "It is a secondary distribution because the shares are sold after the initial public offering", "It is a fourth market transaction if the shares are placed with institutional investors", "It is a primary market transaction because the issuer receives the proceeds"], "answer": 3, "explanation": "Follow the cash: whenever the issuer sells new shares and receives the money it is a primary-market transaction, even though the industry calls it a 'secondary offering.' A secondary distribution is a sale of existing shares by insiders, where the issuer gets nothing. (02-foundations.md §3.B.1)", "calc": false, "source": "02-foundations.md §3.B.1"}, {"id": "fnd-L5-02", "domain": "foundations", "level": 5, "topic": "zero-coupon-risk-profile", "module": "M8", "stem": "All of the following statements about a zero-coupon bond are TRUE EXCEPT:", "options": ["Its holder faces substantial reinvestment risk on the periodic interest payments", "It is sold at a deep discount and redeemed at par at maturity", "It carries greater interest-rate risk than a coupon bond of the same maturity", "Its rate of return is locked in at purchase if it is held to maturity"], "answer": 0, "explanation": "A zero pays no periodic interest, so there is nothing to reinvest and it has no reinvestment risk — that is precisely why its return is locked in when held to maturity. The trade-off is maximum interest-rate (price) risk, since all of its value is one distant payment. (02-foundations.md §3.H.5)", "calc": false, "source": "02-foundations.md §3.H.5"}, {"id": "fnd-L5-03", "domain": "foundations", "level": 5, "topic": "which-rate-the-fed-sets", "module": "M9", "stem": "Which of the following interest rates is set directly by the Federal Reserve rather than determined by banks or the market?", "options": ["The federal funds rate", "The discount rate", "The prime rate", "The broker call loan rate"], "answer": 1, "explanation": "The Fed Board sets the discount rate it charges banks at the discount window. The fed funds rate is charged bank-to-bank and moves daily within a target range the FOMC sets — the Fed targets it but does not set it — while prime and broker call rates are set by commercial banks. (02-foundations.md §3.F.1, §4 trap 7)", "calc": false, "source": "02-foundations.md §3.F.1"}, {"id": "fnd-L5-04", "domain": "foundations", "level": 5, "topic": "working-capital-effects", "module": "M10", "stem": "Which of the following corporate transactions would have NO effect on the company's working capital?", "options": ["Declaring and paying a cash dividend to common stockholders", "Issuing 20-year bonds for cash", "Collecting an account receivable in cash", "Purchasing a machine for cash"], "answer": 2, "explanation": "Collecting a receivable swaps one current asset (receivables) for another (cash), so working capital (current assets − current liabilities) is unchanged. Declaring and paying a dividend or buying equipment with cash reduces it; issuing long-term bonds for cash raises it, because the new liability is long-term. (02-foundations.md §3.I.4, §4 trap 10)", "calc": false, "source": "02-foundations.md §3.I.4"}, {"id": "fnd-L5-05", "domain": "foundations", "level": 5, "topic": "ex-dividend-date-under-t-plus-1", "module": "M5", "stem": "A corporation declares a regular quarterly cash dividend with a record date of Thursday, June 11, 2026. What is the LAST day an investor can buy the stock in a regular-way trade and still receive the dividend?", "options": ["Tuesday, June 9", "Thursday, June 11", "Friday, June 12", "Wednesday, June 10"], "answer": 3, "explanation": "Under T+1 (FINRA Rule 11140 as amended 2024-05-28) the ex-dividend date for a regular cash dividend is the record date itself, so a purchase on Wednesday, June 10 settles on the record date and earns the dividend; buying on June 11 is ex-dividend. Tuesday, June 9 is the stale T+2-era answer ('ex-date one business day before record'). (02-foundations.md §3.E step 8)", "calc": true, "source": "02-foundations.md §3.E.8"}, {"id": "muni-L1-01", "domain": "municipal", "level": 1, "topic": "why-cities-borrow", "module": "M26", "stem": "A city wants to build a new high school that will serve residents for the next 40 years, but the cost is far larger than one year's tax collections. Why would the city issue bonds rather than pay for the school out of a single year's budget?", "options": ["Bonds let the city avoid ever repaying the money, since municipal debt is forgiven after 30 years", "Bonds spread the cost over many years so the taxpayers who use the school over its life share in paying for it", "Federal law prohibits cities from spending tax revenue on capital projects such as schools", "Bond interest is paid by the federal government, making borrowing free for the city"], "answer": 1, "explanation": "A municipality borrows to fund large, long-lived capital projects and repays principal and interest from future taxes or revenues over the bond's life (05-municipal.md §3.1, §3.2.1). Bonds are real debt; the tax exemption is on the investor's federal income tax, not a federal subsidy of the city's interest.", "calc": false, "source": "05-municipal.md §3.1"}, {"id": "muni-L1-02", "domain": "municipal", "level": 1, "topic": "tax-free-interest-meaning", "module": "M12", "stem": "A friend tells you that the interest on her city's bonds is \"tax-free.\" In everyday terms, what does that mean for her?", "options": ["She does not owe federal income tax on the interest payments she receives from the bond", "She will never owe any tax of any kind on the bond, including on a profit if she sells it for more than she paid", "The city pays her income taxes for her as part of each interest payment", "The interest is taxed at the lower long-term capital gains rate instead of at ordinary rates"], "answer": 0, "explanation": "Municipal bond interest is generally exempt from federal income tax under IRC §103, but a capital gain from selling the bond above cost is fully taxable, which is the classic trap (05-municipal.md §3.3, §4).", "calc": false, "source": "05-municipal.md §3.3"}, {"id": "muni-L1-03", "domain": "municipal", "level": 1, "topic": "toll-road-revenue-bond-repayment", "module": "M26", "stem": "A state highway authority sells bonds to build a new toll road and promises to repay bondholders only from the tolls the road collects. Who is ultimately paying back these bonds?", "options": ["All taxpayers of the state, through their state income taxes", "The federal Department of Transportation, through highway grants", "The drivers who use the road, through the tolls they pay", "The bond dealers who sold the bonds to investors"], "answer": 2, "explanation": "This is a revenue bond, backed only by the revenues of the specific facility and not by the issuer's taxing power (05-municipal.md §3.2.2). If tolls fall short, the bondholders rather than the taxpayers bear the loss.", "calc": false, "source": "05-municipal.md §3.2.2"}, {"id": "muni-L1-04", "domain": "municipal", "level": 1, "topic": "go-bond-property-tax-backing", "module": "M26", "stem": "A school district sells bonds backed by its \"full faith, credit, and taxing power.\" If the district's normal revenues are not enough to make the bond payments, what is the district expected to do?", "options": ["Default on the bonds, because a school district cannot legally borrow money", "Ask the bondholders to accept lower payments until revenues recover", "Sell the school buildings to raise the cash needed", "Raise property taxes on residents as needed to cover the bond payments"], "answer": 3, "explanation": "A general obligation bond is backed by the issuer's full faith, credit, and taxing power, which for localities means chiefly ad valorem property taxes, so the issuer levies whatever tax is needed to pay debt service (05-municipal.md §3.2.1). That taxing commitment is why GO bonds usually require voter approval.", "calc": false, "source": "05-municipal.md §3.2.1"}, {"id": "muni-L1-05", "domain": "municipal", "level": 1, "topic": "why-muni-yields-are-lower", "module": "M12", "stem": "A city bond and a corporate bond of similar credit quality mature on the same date, but the city bond pays a noticeably lower interest rate. What is the MOST likely reason investors accept the lower rate on the city bond?", "options": ["City bonds are guaranteed by the federal government, so they carry no risk of loss", "Investors keep the city bond's interest free of federal income tax, so a lower rate leaves them with just as much after tax", "Corporate bonds pay interest only once a year, while city bonds pay monthly", "Cities are legally required to pay lower interest rates than corporations"], "answer": 1, "explanation": "Because municipal interest is federally tax-exempt, investors compare after-tax returns, so muni yields sit below comparable taxable yields before tax (05-municipal.md §3.3, §3.5 yield relationships). Municipal bonds are not federally guaranteed.", "calc": false, "source": "05-municipal.md §3.5"}, {"id": "muni-L2-01", "domain": "municipal", "level": 2, "topic": "go-vs-revenue-features", "module": "M12", "stem": "Which of the following statements correctly distinguishes a general obligation (GO) bond from a revenue bond?", "options": ["A revenue bond is backed by the issuer's taxing power, while a GO bond is backed by user fees", "A revenue bond generally requires voter approval, while a GO bond does not", "A GO bond generally requires voter approval and counts against the issuer's debt limit, while a revenue bond does neither", "A GO bond generally yields more than a revenue bond of the same issuer"], "answer": 2, "explanation": "GO bonds are backed by taxing power, usually need voter approval, and are subject to the statutory debt limit; revenue bonds are backed only by facility revenues, need no voter approval, sit outside the debt limit, and generally yield more (05-municipal.md §3.2.1 and §3.2.2).", "calc": false, "source": "05-municipal.md §3.2.2"}, {"id": "muni-L2-02", "domain": "municipal", "level": 2, "topic": "short-term-notes-BAN", "module": "M26", "stem": "A county needs interim financing for a courthouse it plans to fund with a long-term bond issue later in the year. Which short-term municipal note would it MOST likely issue?", "options": ["Tax anticipation note (TAN)", "Bond anticipation note (BAN)", "Revenue anticipation note (RAN)", "Grant anticipation note (GAN)"], "answer": 1, "explanation": "A BAN is repaid from the proceeds of a coming long-term bond issue; TANs are repaid from upcoming taxes, RANs from non-tax revenue such as state aid, and GANs from federal grants (05-municipal.md §3.2.4).", "calc": false, "source": "05-municipal.md §3.2.4"}, {"id": "muni-L2-03", "domain": "municipal", "level": 2, "topic": "emma-public-disclosure", "module": "M28", "stem": "A retail customer wants to look up a municipal bond's official statement, its issuer's recent continuing disclosures, and real-time trade prices at no charge. The registered representative should direct the customer to:", "options": ["The Bond Buyer's daily new-issue calendar", "FINRA's TRACE system", "The issuer's bond counsel", "The MSRB's EMMA website"], "answer": 3, "explanation": "EMMA (Electronic Municipal Market Access) is the MSRB's free public site carrying official statements, Rule 15c2-12 continuing disclosures, and trade prices reported through RTRS (05-municipal.md §3.6). TRACE is FINRA's corporate-bond reporting system, not a municipal source.", "calc": false, "source": "05-municipal.md §3.6"}, {"id": "muni-L2-04", "domain": "municipal", "level": 2, "topic": "double-barreled-bond", "module": "M26", "stem": "A municipal bond is issued to finance a water treatment plant, is payable from the plant's user charges, and is additionally backed by the city's full taxing power if those charges fall short. This bond is BEST described as a:", "options": ["Double-barreled bond", "Moral obligation bond", "Special assessment bond", "Industrial development bond"], "answer": 0, "explanation": "A double-barreled bond is a revenue bond additionally backed by the issuer's GO taxing power, and it is analyzed and rated as a GO (05-municipal.md §3.2.3). A moral obligation bond carries only a legislature's non-binding option to appropriate funds.", "calc": false, "source": "05-municipal.md §3.2.3"}, {"id": "muni-L2-05", "domain": "municipal", "level": 2, "topic": "529-municipal-fund-security", "module": "M28", "stem": "Interests in a state-sponsored Section 529 college savings plan are classified under MSRB rules as:", "options": ["Open-end investment company shares registered under the Investment Company Act of 1940", "General obligation bonds of the sponsoring state", "Municipal fund securities, sold with an official statement (program disclosure document)", "Exempt securities that fall entirely outside the MSRB's jurisdiction"], "answer": 2, "explanation": "Under MSRB Rule D-12, 529 plans, ABLE accounts, and LGIPs are municipal fund securities: they are not 1940 Act funds and are sold with an official statement subject to G-17, G-19, G-21, G-32, and G-45 (05-municipal.md §3.8, §3.7).", "calc": false, "source": "05-municipal.md §3.8"}, {"id": "muni-L3-01", "domain": "municipal", "level": 3, "topic": "taxable-equivalent-yield", "module": "M26", "stem": "A customer in the 28% federal marginal tax bracket is considering a municipal bond yielding 3.60%. What is the bond's taxable-equivalent yield?", "options": ["2.59%", "5.00%", "4.61%", "12.86%"], "answer": 1, "explanation": "TEY = tax-free yield ÷ (1 − marginal rate) = 3.60% ÷ 0.72 = 5.00% (05-municipal.md §3.3). Multiplying by 0.72 to get 2.59% is the tax-free-equivalent formula run in the wrong direction.", "calc": true, "source": "05-municipal.md §3.3"}, {"id": "muni-L3-02", "domain": "municipal", "level": 3, "topic": "competitive-vs-negotiated-sale", "module": "M28", "stem": "A city plans to issue $50 million of general obligation bonds. Which of the following is MOST characteristic of the way this issue would typically be brought to market?", "options": ["The city publishes a Notice of Sale and awards the bonds to the syndicate submitting the lowest net or true interest cost", "The city appoints a single underwriter in advance to help structure and price the issue", "The city sells the bonds directly to fewer than 35 institutional investors without an official statement", "The city's financial advisor purchases the bonds and resells them to the public"], "answer": 0, "explanation": "GO bonds are typically sold by competitive sealed bid: the issuer publishes a Notice of Sale in The Bond Buyer and awards the issue to the lowest NIC or TIC bid, while negotiated sales are typical for revenue bonds (05-municipal.md §3.4). Under G-23 a financial advisor may not underwrite the issue it advises on.", "calc": false, "source": "05-municipal.md §3.4"}, {"id": "muni-L3-03", "domain": "municipal", "level": 3, "topic": "legal-opinion-bond-counsel", "module": "M28", "stem": "Which of the following statements about the legal opinion on a new municipal bond issue is TRUE?", "options": ["It is written by the syndicate manager and guarantees the bonds against default", "It is contained in the Notice of Sale published by the issuer", "A \"qualified\" opinion is one that expresses no reservations about the issue's legality", "It is written by bond counsel and states that the bonds are validly issued and the interest is federally tax-exempt"], "answer": 3, "explanation": "Bond counsel's opinion states that the bonds are legally binding on the issuer and that interest is federally tax-exempt; an unqualified (clean) opinion has no reservations while a qualified opinion flags a concern (05-municipal.md §3.4). The Notice of Sale names bond counsel but does not contain the opinion, which appears in the official statement and on the bonds.", "calc": false, "source": "05-municipal.md §3.4"}, {"id": "muni-L3-04", "domain": "municipal", "level": 3, "topic": "serial-basis-vs-term-dollar-quotes", "module": "M27", "stem": "A dealer quotes a municipal bond as \"5.20 basis.\" Which of the following is TRUE about this quote?", "options": ["The bond is a term bond and the quote means $520 per $1,000 of par", "The bond is most likely a serial bond and the quote means a yield to maturity of 5.20%", "The bond's coupon rate is 5.20% and it is trading at par", "The quote must be a nominal quote because no dollar price was given"], "answer": 1, "explanation": "Serial bonds are quoted on a yield (basis) basis, so \"5.20 basis\" means a 5.20% YTM, while term (\"dollar\") bonds are quoted as a percentage of par (05-municipal.md §3.2.5, §3.5). If the coupon exceeds the basis the bond is priced above par.", "calc": false, "source": "05-municipal.md §3.5"}, {"id": "muni-L3-05", "domain": "municipal", "level": 3, "topic": "bond-buyer-placement-ratio", "module": "M28", "stem": "The Bond Buyer's placement ratio for the most recent week is 95%. This tells a municipal underwriter that:", "options": ["Municipal yields rose 95 basis points during the week", "95% of the bonds scheduled for sale over the next 30 days have already been placed", "Of the new issues of $1 million or more offered that week, 95% were sold, indicating strong demand", "The 20-Bond GO Index closed at 95% of its 52-week high"], "answer": 2, "explanation": "The placement ratio is a weekly figure: bonds sold ÷ bonds offered that week for issues of $1 million or more, and a high ratio signals strong demand for new issues (05-municipal.md §3.4). The 30-day visible supply is the separate forward-looking measure of par value scheduled for sale.", "calc": false, "source": "05-municipal.md §3.4"}, {"id": "muni-L4-01", "domain": "municipal", "level": 4, "topic": "syndicate-order-priority-allocation", "module": "M28", "stem": "A syndicate wins a $20 million new municipal issue. The manager receives presale orders for $12 million, group net orders for $6 million, designated orders for $4 million, and member orders for $3 million. Under the standard priority of orders disclosed per MSRB Rule G-11, how many bonds are allocated to the designated orders?", "options": ["$0", "$2 million", "$4 million", "$3 million"], "answer": 1, "explanation": "Priority runs presale, then group net, then designated, then member (\"Please Give Dealers Money\"): presale takes $12M and group net takes $6M for $18M total, leaving $2M for the $4M of designated orders and nothing for member orders (05-municipal.md §3.4).", "calc": true, "source": "05-municipal.md §3.4"}, {"id": "muni-L4-02", "domain": "municipal", "level": 4, "topic": "net-revenue-coverage-ratio", "module": "M26", "stem": "A toll-road authority's revenue bonds are secured by a net revenue pledge. Last year the road produced gross revenues of $9,000,000, operating and maintenance expenses were $3,000,000, and annual debt service (interest plus principal) was $2,500,000. What was the debt service coverage ratio?", "options": ["3.6 to 1", "1.2 to 1", "2.0 to 1", "2.4 to 1"], "answer": 3, "explanation": "Under a net revenue pledge, O&M is paid before debt service, so coverage = (gross revenue − O&M) ÷ debt service = ($9M − $3M) ÷ $2.5M = 2.4× (05-municipal.md §3.2.2). The 3.6× figure is the gross-pledge ratio, computed without deducting O&M.", "calc": true, "source": "05-municipal.md §3.2.2"}, {"id": "muni-L4-03", "domain": "municipal", "level": 4, "topic": "tax-free-equivalent-yield", "module": "M26", "stem": "A customer in the 24% federal marginal tax bracket can buy a corporate bond yielding 5.50%. To provide the same after-tax return, a municipal bond of comparable quality would need to yield approximately:", "options": ["4.18%", "7.24%", "1.32%", "5.50%"], "answer": 0, "explanation": "Tax-free-equivalent (net) yield = taxable yield × (1 − tax rate) = 5.50% × 0.76 = 4.18% (05-municipal.md §3.3). Dividing by 0.76 to get 7.24% runs the TEY formula in the wrong direction; that converts a muni yield into its taxable equivalent, not the reverse.", "calc": true, "source": "05-municipal.md §3.3"}, {"id": "muni-L4-04", "domain": "municipal", "level": 4, "topic": "g37-de-minimis-contribution", "module": "M28", "stem": "A municipal finance professional (MFP) who lives and is registered to vote in Springfield contributes $250 to the primary campaign of a candidate for Springfield mayor and, four months later, another $250 to the same candidate's general election campaign. Under MSRB Rule G-37, which of the following is TRUE?", "options": ["The firm is barred from negotiated municipal securities business with Springfield for two years because the combined $500 exceeds the de minimis limit", "The contributions are permitted only if the firm refunds them within 60 days of discovery", "Both contributions are permitted, because the $250 de minimis exemption applies per election and the MFP is entitled to vote for the candidate", "The contributions are permitted only if the firm limits itself to competitive-bid business with Springfield"], "answer": 2, "explanation": "The G-37 de minimis exemption is $250 per election, with primary and general elections counted separately, and it applies only when the MFP is entitled to vote for the official (05-municipal.md §3.7, Rule G-37). A two-year ban is triggered only by a contribution above that limit; the 60-day refund is the separate automatic-exemption procedure for small inadvertent violations.", "calc": false, "source": "05-municipal.md §3.7"}, {"id": "muni-L4-05", "domain": "municipal", "level": 4, "topic": "de-minimis-market-discount", "module": "M27", "stem": "A customer buys a municipal bond with 8 years remaining to maturity in the secondary market at 97 and holds it to maturity. For federal tax purposes, the 3-point gain realized at maturity is:", "options": ["Tax-exempt, because it is treated as original issue discount on a municipal bond", "A long-term capital gain, because the discount is de minimis", "Not reportable, because the bond was held to maturity", "Taxed as ordinary income, because the discount exceeds the de minimis threshold"], "answer": 3, "explanation": "The de minimis threshold is 0.25% of par × full years to maturity = 0.25 × 8 = 2 points, so the breakpoint price is 98; a 3-point market discount exceeds it and is taxed as ordinary income (05-municipal.md §3.3). Only original issue discount accretes as tax-exempt interest.", "calc": true, "source": "05-municipal.md §3.3"}, {"id": "muni-L5-01", "domain": "municipal", "level": 5, "topic": "western-vs-eastern-account-liability", "module": "M28", "stem": "A member of a Western (divided) syndicate account has a 20% participation in a $10 million municipal new issue. The member sells its entire $2 million allotment, but at the end of the order period $500,000 of the issue allotted to other members remains unsold. The member's liability for the unsold bonds is:", "options": ["$0", "$100,000", "$500,000", "$2,000,000"], "answer": 0, "explanation": "In a Western (divided) account each member's liability is limited to its own allotment, so a member that sold out owes nothing; $100,000 (20% of the unsold $500,000) would be the answer in an Eastern (undivided) account, where every member shares in any unsold bonds (05-municipal.md §3.4).", "calc": true, "source": "05-municipal.md §3.4"}, {"id": "muni-L5-02", "domain": "municipal", "level": 5, "topic": "designated-order-mechanics", "module": "M28", "stem": "During the order period for a new municipal issue, an institutional investor instructs the syndicate manager that the takedown on its order is to be credited to two syndicate members of the investor's choosing. Under the standard priority of orders and MSRB Rule G-11, which of the following statements about this order is TRUE?", "options": ["It ranks ahead of group net orders because the investor named the members that are to receive the credit", "The takedown is credited to every syndicate member in proportion to its participation in the account", "It is filled after member orders, because the credit was directed by the buyer rather than earned by the syndicate", "It is filled after presale and group net orders, and the manager must pay the two members their designated credits within 10 calendar days of the issuer's delivery of the bonds"], "answer": 3, "explanation": "A designated order lets the buyer name which members receive the takedown credit; it ranks third in the standard priority (presale, group net, designated, member) that G-11 requires the manager to disclose before the first offer, and G-11 also requires the manager to pay designations within 10 calendar days of the issuer's delivery of the bonds, with final syndicate settlement within 30 calendar days (05-municipal.md §3.4, §3.7). Pro-rata credit to the whole account describes a group net order, not a designated order.", "calc": false, "source": "05-municipal.md §3.4, §3.7"}, {"id": "muni-L5-03", "domain": "municipal", "level": 5, "topic": "state-taxation-out-of-state-and-territorial", "module": "M27", "stem": "A California resident holds a New York City general obligation bond and a Commonwealth of Puerto Rico bond. Interest on which of these bonds is exempt from California state income tax?", "options": ["Both bonds", "The New York City bond only", "The Puerto Rico bond only", "Neither bond"], "answer": 2, "explanation": "States generally exempt interest only on their own bonds and tax out-of-state munis, so California taxes the NYC bond's interest; bonds of U.S. territories (Puerto Rico, Guam, USVI) are exempt from federal, state, and local tax for every U.S. investor (05-municipal.md §3.3, §3.2.3).", "calc": false, "source": "05-municipal.md §3.3"}, {"id": "muni-L5-04", "domain": "municipal", "level": 5, "topic": "market-premium-amortization", "module": "M27", "stem": "A customer buys a 10-year municipal bond in the secondary market at 110 and holds it to maturity. All of the following statements are TRUE EXCEPT:", "options": ["The premium must be amortized over the remaining life of the bond", "The annual amortization is not deductible against the customer's other income", "The customer's cost basis decreases each year", "At maturity the customer reports a capital loss of $100 per bond"], "answer": 3, "explanation": "Market premium on a muni must be amortized (constant yield) down to par, the amortization is not deductible because it offsets tax-exempt interest, and the basis falls to par by maturity, so there is no capital loss at maturity (05-municipal.md §3.3).", "calc": false, "source": "05-municipal.md §3.3"}, {"id": "muni-L5-05", "domain": "municipal", "level": 5, "topic": "msrb-rulemaking-vs-enforcement", "module": "M28", "stem": "Which of the following statements regarding the Municipal Securities Rulemaking Board (MSRB) is TRUE?", "options": ["The MSRB examines broker-dealers for compliance with its rules and imposes fines for violations", "MSRB rules are enforced by FINRA for broker-dealers and by the bank regulators (OCC, Federal Reserve, FDIC) for bank dealers", "The MSRB may require a municipal issuer to file an official statement with it before a new issue is sold", "MSRB rules apply to municipal advisors but not to bank dealers"], "answer": 1, "explanation": "The MSRB writes rules but has no enforcement or examination power; FINRA enforces for broker-dealers, the bank regulators for bank dealers, and the SEC over all (05-municipal.md §3.1). The Tower Amendment bars the MSRB and SEC from requiring issuers to file documents before sale, and MSRB rules cover bank dealers and municipal advisors alike.", "calc": false, "source": "05-municipal.md §3.1"}, {"id": "opt-L1-01", "domain": "options", "level": 1, "topic": "right-not-obligation", "module": "M13", "stem": "An investor pays $200 for a contract that gives her \"the right, but not the obligation,\" to buy 100 shares of ABC at $50 per share at any time over the next three months. ABC then falls to $40. Which of the following BEST describes her situation?", "options": ["She must buy the 100 shares at $50 and will lose $1,000 on the shares", "She may simply let the contract go unused, losing only the $200 she paid", "She can demand her $200 back because the price moved against her", "She must buy the shares at $40 and pay an additional $200 penalty"], "answer": 1, "explanation": "A buyer holds a right, not a duty: if exercising makes no sense she walks away and the contract expires. Her loss is capped at the $200 premium she paid (06-options.md §3.1, §3.4).", "calc": false, "source": "06-options.md §3.1"}, {"id": "opt-L1-02", "domain": "options", "level": 1, "topic": "premium-goes-to-writer", "module": "M13", "stem": "Maria sells (writes) an option contract to Dan and collects a $300 premium. Dan later decides not to use the contract and lets it expire. What happens to the $300?", "options": ["It is refunded to Dan because he never exercised the contract", "It is split evenly between Maria and Dan", "It is held by the exchange until a new contract is written", "Maria keeps it; the premium is hers whether or not Dan ever exercises"], "answer": 3, "explanation": "The premium is the price of the right and is paid to the writer up front; it is never refunded. If the option expires unused, the writer's profit is the entire premium (06-options.md §3.1, §3.4).", "calc": false, "source": "06-options.md §3.1"}, {"id": "opt-L1-03", "domain": "options", "level": 1, "topic": "protective-put-rationale", "module": "M20", "stem": "An investor owns 100 shares of XYZ that she bought at $60. She is worried the price could drop sharply over the next few months but does not want to sell. Why might she pay a premium for a put option on XYZ?", "options": ["The put lets her sell her shares at a set price even if the market price collapses, working like an insurance policy on the stock", "The put increases the dividends she receives while she waits for the price to recover", "The put guarantees she will make a profit no matter what XYZ does", "The put removes all risk from the position, including the premium she paid"], "answer": 0, "explanation": "A put gives the right to sell at the strike, so it sets a floor under the stock's value; the premium is the cost of that insurance and is itself at risk (06-options.md §3.6 protective put, §5 insurance model).", "calc": false, "source": "06-options.md §3.6"}, {"id": "opt-L1-04", "domain": "options", "level": 1, "topic": "call-definition", "module": "M13", "stem": "A friend tells you he has \"bought a call\" on a technology stock. In plain terms, what has he purchased?", "options": ["A promise to sell the stock at a fixed price if he is asked to", "A share of the company's future dividend payments", "The right to buy the stock at a fixed price for a limited time, which becomes valuable if the stock rises", "The right to sell the stock at a fixed price, which becomes valuable if the stock falls"], "answer": 2, "explanation": "A call is the right to buy the underlying at the strike price until expiration; the holder is bullish (call up, put down). A put is the right to sell (06-options.md §3.1).", "calc": false, "source": "06-options.md §3.1"}, {"id": "opt-L1-05", "domain": "options", "level": 1, "topic": "buyer-max-loss-multiplier", "module": "M13", "stem": "An option on 100 shares is quoted at 2.50 per share. An investor buys one contract. What is the MOST money this investor can lose on the position?", "options": ["$2.50", "$250", "$2,500", "An unlimited amount, because the stock could keep moving against him"], "answer": 1, "explanation": "Premiums are quoted per share and a contract covers 100 shares: 2.50 × 100 = $250. A buyer can never lose more than the premium paid (06-options.md §3.1 multiplier, §3.4).", "calc": true, "source": "06-options.md §3.1"}, {"id": "opt-L2-01", "domain": "options", "level": 2, "topic": "four-positions-outlook", "module": "M13", "stem": "A customer expects the price of ABC stock to DECLINE over the next two months and wants a position with limited risk. Which of the following positions is MOST appropriate?", "options": ["Long ABC call", "Short ABC put", "Long ABC put", "Short ABC call"], "answer": 2, "explanation": "A long put is bearish with loss limited to the premium. A short call is also bearish but carries unlimited risk; a long call and a short put are bullish positions (06-options.md §3.4).", "calc": false, "source": "06-options.md §3.4"}, {"id": "opt-L2-02", "domain": "options", "level": 2, "topic": "occ-role", "module": "M13", "stem": "Which of the following BEST describes the role of the Options Clearing Corporation (OCC) in the listed options market?", "options": ["It issues and guarantees every listed option contract and standardizes the contract terms", "It sets the premium at which each option contract trades", "It approves each customer's options account before the first trade", "It publishes the buy and sell recommendations used by options traders"], "answer": 0, "explanation": "The OCC is the issuer and guarantor of all listed options, standardizes terms (size, strikes, expirations), clears trades and assigns exercises; premiums are set by the market and accounts are approved by a Registered Options Principal (06-options.md §3.1).", "calc": false, "source": "06-options.md §3.1"}, {"id": "opt-L2-03", "domain": "options", "level": 2, "topic": "american-vs-european", "module": "M13", "stem": "A customer holds a European-style index option with two months remaining until expiration. Which of the following statements is TRUE?", "options": ["The option can be exercised on any business day but cannot be sold before expiration", "The option can neither be exercised nor sold until expiration", "The option can be exercised at any time and sold at any time before expiration", "The option can be sold at any time before expiration but exercised only at expiration"], "answer": 3, "explanation": "Exercise style limits exercise, not trading: a European option may be exercised only at expiration, but it trades freely until then. American-style options may be exercised on any business day (06-options.md §3.1).", "calc": false, "source": "06-options.md §3.1"}, {"id": "opt-L2-04", "domain": "options", "level": 2, "topic": "moneyness-same-both-sides", "module": "M13", "stem": "ABC stock is trading at 56. An ABC Oct 50 call is in the money for:", "options": ["both the holder and the writer of the call", "the holder only; the writer's position is out of the money", "the writer only, because the writer collected the premium", "neither party, until the stock rises above 50 plus the premium"], "answer": 0, "explanation": "Moneyness compares stock to strike (56 − 50 = 6 in the money), ignores the premium, and is identical for buyer and writer; a short call is in the money whenever the stock is above the strike (06-options.md §3.3).", "calc": false, "source": "06-options.md §3.3"}, {"id": "opt-L2-05", "domain": "options", "level": 2, "topic": "odd-delivery-timing", "module": "M22", "stem": "A registered representative is opening an options account for a new customer. The Options Disclosure Document (ODD) must be furnished to the customer:", "options": ["within 15 days after the account is approved for options trading", "at or before the time the account is approved for options trading", "no later than the settlement date of the customer's first options trade", "only if the customer intends to write uncovered options"], "answer": 1, "explanation": "Under FINRA Rule 2360 the ODD is delivered at or prior to account approval, before any trade. The 15-day clock applies to returning the signed options agreement, not the ODD (06-options.md §3.15).", "calc": false, "source": "06-options.md §3.15"}, {"id": "opt-L3-01", "domain": "options", "level": 3, "topic": "long-call-breakeven", "module": "M19", "stem": "A customer buys 1 ABC Jun 50 call at 4. What is the customer's breakeven point at expiration?", "options": ["46", "50", "54", "58"], "answer": 2, "explanation": "Calls add: breakeven = strike + premium = 50 + 4 = 54, the same for buyer and writer. 46 subtracts (the put rule), 50 forgets the premium, 58 double-counts it (06-options.md §3.4).", "calc": true, "source": "06-options.md §3.4"}, {"id": "opt-L3-02", "domain": "options", "level": 3, "topic": "short-put-max-loss", "module": "M19", "stem": "A customer writes 1 XYZ Sep 40 put at 3. What is the customer's maximum potential loss?", "options": ["$300", "$37", "$3,700", "$4,300"], "answer": 2, "explanation": "If XYZ goes to zero the writer must buy worthless stock at 40, offset by the 3 received: (40 − 3) × 100 = $3,700. $300 is the max gain, $37 forgets the multiplier, $4,300 flips the sign (06-options.md §3.4).", "calc": true, "source": "06-options.md §3.4"}, {"id": "opt-L3-03", "domain": "options", "level": 3, "topic": "intrinsic-vs-time-value", "module": "M19", "stem": "ABC stock is trading at 58. An ABC Mar 50 call is quoted at 10. What is the time value of the call?", "options": ["2", "8", "10", "0"], "answer": 0, "explanation": "Intrinsic value = stock − strike = 58 − 50 = 8; time value = premium − intrinsic = 10 − 8 = 2. Choosing 8 gives the intrinsic value and 10 the whole premium (06-options.md §3.3).", "calc": true, "source": "06-options.md §3.3"}, {"id": "opt-L3-04", "domain": "options", "level": 3, "topic": "covered-call-max-gain", "module": "M20", "stem": "A customer buys 100 shares of ABC at 45 and writes 1 ABC Oct 50 call at 3. What is the customer's maximum potential gain?", "options": ["$300", "$500", "$4,200", "$800"], "answer": 3, "explanation": "If assigned, the stock is sold at 50: (50 − 45) + 3 premium = 8 × 100 = $800. $300 is the premium alone, $500 ignores the premium, $4,200 is the maximum loss (45 − 3) (06-options.md §3.6).", "calc": true, "source": "06-options.md §3.6"}, {"id": "opt-L3-05", "domain": "options", "level": 3, "topic": "long-put-pl-at-expiration", "module": "M19", "stem": "A customer buys 1 XYZ Sep 40 put at 3. At expiration XYZ is trading at 30 and the customer exercises. Ignoring commissions, what is the customer's profit or loss?", "options": ["$1,000 profit", "$700 profit", "$300 loss", "$1,300 profit"], "answer": 1, "explanation": "Intrinsic value at expiration = 40 − 30 = 10; less the 3 premium = 7 × 100 = $700 profit. $1,000 forgets the premium, $1,300 adds it instead of subtracting, $300 is the loss if the put expired (06-options.md §3.4).", "calc": true, "source": "06-options.md §3.4"}, {"id": "opt-L4-01", "domain": "options", "level": 4, "topic": "bull-call-spread-max-gain", "module": "M21", "stem": "A customer buys 1 ABC Jul 50 call at 7 and sells 1 ABC Jul 60 call at 3. What is the customer's maximum potential gain?", "options": ["$400", "$1,000", "$300", "$600"], "answer": 3, "explanation": "Net debit = 7 − 3 = 4. Max gain = difference in strikes − net debit = (60 − 50) − 4 = 6 × 100 = $600. $400 is the max loss (net debit), $1,000 ignores the premium, $300 uses one leg only (06-options.md §3.7).", "calc": true, "source": "06-options.md §3.7"}, {"id": "opt-L4-02", "domain": "options", "level": 4, "topic": "credit-put-spread-breakeven", "module": "M21", "stem": "A customer sells 1 XYZ Oct 80 put at 9 and buys 1 XYZ Oct 70 put at 4. What is the customer's breakeven point?", "options": ["65", "71", "75", "85"], "answer": 2, "explanation": "Net credit = 9 − 4 = 5. Puts: subtract the net premium from the higher strike: 80 − 5 = 75. 71 uses the single 9 premium, 85 adds instead of subtracting, 65 uses the wrong strike (06-options.md §3.7 PSH).", "calc": true, "source": "06-options.md §3.7"}, {"id": "opt-L4-03", "domain": "options", "level": 4, "topic": "long-straddle-breakevens", "module": "M21", "stem": "A customer buys 1 ABC Jan 60 call at 4 and buys 1 ABC Jan 60 put at 5. The customer's breakeven points are:", "options": ["69 and 51", "64 and 56", "65 and 55", "61 and 59"], "answer": 0, "explanation": "Straddles ADD the premiums: total 4 + 5 = 9, so breakevens are 60 + 9 = 69 and 60 − 9 = 51. 64/56 use each leg's own premium; 61/59 subtract the premiums as if it were a spread (06-options.md §3.8).", "calc": true, "source": "06-options.md §3.8"}, {"id": "opt-L4-04", "domain": "options", "level": 4, "topic": "protective-put-combined-pl", "module": "M20", "stem": "A customer buys 100 shares of ABC at 45 and buys 1 ABC Dec 40 put at 2. ABC falls to 30 and the customer exercises the put. What is the customer's gain or loss on the combined position?", "options": ["$1,500 loss", "$500 loss", "$700 loss", "$1,700 loss"], "answer": 2, "explanation": "T-chart: money out = 45 (stock) + 2 (put) = 47; money in = 40 (stock sold via the put). Net −7 × 100 = $700 loss, which is the position's maximum loss regardless of how far ABC falls. $1,500 and $1,700 ignore the put's floor at 40 (06-options.md §3.5, §3.6).", "calc": true, "source": "06-options.md §3.6"}, {"id": "opt-L4-05", "domain": "options", "level": 4, "topic": "uncovered-call-margin", "module": "M22", "stem": "A customer writes 1 ABC Nov 50 call at 3 in a margin account when ABC is trading at 48. What is the margin requirement on this uncovered call?", "options": ["$780", "$960", "$1,260", "$1,060"], "answer": 3, "explanation": "Greater of: 20% × $4,800 = $960 + $300 premium − $200 out-of-the-money = $1,060; or 10% × $4,800 + $300 = $780. $1,060 governs. $1,260 forgets to subtract the OTM amount; $960 omits the premium (06-options.md §3.14).", "calc": true, "source": "06-options.md §3.14"}, {"id": "opt-L5-01", "domain": "options", "level": 5, "topic": "index-cash-settlement", "module": "M22", "stem": "A customer is long 1 OEX 2900 call. At 10:00 a.m., with the OEX at 2912, the customer exercises the option. The OEX closes that day at 2908. The customer will receive:", "options": ["$1,200 in cash on the next business day", "$800 in cash on the next business day", "$800 in cash on the second business day after exercise", "$1,200 worth of the index's component stocks on the next business day"], "answer": 1, "explanation": "Index options settle in cash on the CLOSING index value of the exercise day, not the value when the order was entered: (2908 − 2900) × $100 = $800, paid the next business day. OEX is American-style, so early exercise is permitted (06-options.md §3.9).", "calc": true, "source": "06-options.md §3.9"}, {"id": "opt-L5-02", "domain": "options", "level": 5, "topic": "credit-spread-except", "module": "M21", "stem": "A customer sells 1 ABC Jul 50 call at 7 and buys 1 ABC Jul 60 call at 3. All of the following statements about this position are TRUE EXCEPT:", "options": ["The customer is bearish on ABC", "The position was established for a net credit of $400", "The maximum potential loss is $600", "The customer profits if the difference between the two premiums widens"], "answer": 3, "explanation": "This is a credit call spread (short the dominant lower-strike leg): net credit 7 − 3 = 4 = $400, max loss (60 − 50) − 4 = $600, bearish. Credit spreads profit when the spread NARROWS or both legs expire; only debit spreads want the spread to widen (06-options.md §3.7).", "calc": true, "source": "06-options.md §3.7"}, {"id": "opt-L5-03", "domain": "options", "level": 5, "topic": "fx-hedge-inversion", "module": "M22", "stem": "A Japanese manufacturer will receive payment in U.S. dollars in 90 days and wants to use listed currency options to hedge against a decline in the dollar. Which of the following is the BEST hedge?", "options": ["Buy yen calls", "Buy U.S. dollar puts", "Buy yen puts", "Write yen calls"], "answer": 0, "explanation": "There are no listed options on the U.S. dollar in U.S. markets, so a view on the dollar is expressed inversely: a falling dollar means a rising yen, so the firm buys yen calls. EPIC (exporters buy puts) applies only from a U.S. company's perspective (06-options.md §3.10).", "calc": false, "source": "06-options.md §3.10"}, {"id": "opt-L5-04", "domain": "options", "level": 5, "topic": "unlimited-risk-covered-put", "module": "M22", "stem": "Which of the following positions exposes the customer to UNLIMITED loss?", "options": ["Long 1 ABC 50 call and long 1 ABC 50 put", "Short 100 shares of ABC and short 1 ABC 45 put", "Short 1 ABC 50 call and long 1 ABC 60 call", "Short 1 ABC 50 put"], "answer": 1, "explanation": "The 'covered put' (short stock + short put) is unlimited: the short stock loses without ceiling as ABC rises and the put provides no protection. A long straddle loses at most the premiums, a credit call spread at most the strike difference minus the credit, and a naked put at most strike minus premium (06-options.md §3.6, §3.16).", "calc": false, "source": "06-options.md §3.16"}, {"id": "opt-L5-05", "domain": "options", "level": 5, "topic": "put-assignment-tax-basis", "module": "M22", "stem": "A customer writes 1 XYZ Apr 150 put at 12. XYZ falls to 130 and the put is exercised against the customer. For tax purposes, the customer's cost basis per share in the XYZ acquired is:", "options": ["$138", "$162", "$150", "$130"], "answer": 0, "explanation": "The premium follows the stock: a put writer who is assigned buys stock at the strike, and the premium received reduces the cost basis, so 150 − 12 = $138. Exercise itself is not a taxable event; $162 flips the sign, $150 ignores the premium, $130 is the market price (06-options.md §3.13).", "calc": true, "source": "06-options.md §3.13"}, {"id": "pkg-L1-01", "domain": "packaged", "level": 1, "topic": "what-a-mutual-fund-does", "module": "M14", "stem": "An investor puts $1,000 into a mutual fund. Which of the following BEST describes what happens to that money?", "options": ["It is deposited in a bank account that pays the fund's advertised yield and is insured by the FDIC", "It is pooled with other investors' money and invested by a professional manager in a portfolio of securities, and the investor owns a proportional share of that portfolio", "It is lent to the fund company, which repays it with interest on a fixed future date", "It buys shares of the fund management company itself, so the investor profits when the firm earns more fees"], "answer": 1, "explanation": "An investment company pools money from many investors and invests it in securities under a stated objective; each shareholder owns a pro-rata slice of the portfolio, not a bank deposit or a loan to the sponsor. See 07-packaged-retirement-tax.md §3.1.", "calc": false, "source": "07-packaged-retirement-tax.md §3.1"}, {"id": "pkg-L1-02", "domain": "packaged", "level": 1, "topic": "401k-employer-match", "module": "M31", "stem": "An employer matches 100% of an employee's 401(k) contributions up to 4% of salary. An employee earning $50,000 contributes exactly 4% of salary this year. Before any investment gains, how much goes into the employee's account for the year?", "options": ["$2,000, because the employer match is paid only when the employee retires", "$2,080, because the employer adds 4% of the employee's $2,000 contribution", "$4,000, the employee's $2,000 plus a $2,000 employer match", "$6,000, because the employer contributes 4% of salary plus a matching $2,000"], "answer": 2, "explanation": "4% of $50,000 = $2,000 from the employee; a 100% match up to 4% adds another $2,000, for $4,000 total. The match is an immediate 100% return on the contributed dollars, which is why it matters. See §3.7 (401(k)).", "calc": true, "source": "07-packaged-retirement-tax.md §3.7"}, {"id": "pkg-L1-03", "domain": "packaged", "level": 1, "topic": "tax-deferred-meaning", "module": "M14", "stem": "A retirement account is described as \"tax-deferred.\" This means that the earnings inside the account:", "options": ["are never taxed", "are taxed each year, but at a reduced rate", "are taxed twice, once when earned and again when withdrawn", "are not taxed until the money is withdrawn from the account"], "answer": 3, "explanation": "Deferred means pay later: growth compounds untaxed and is taxed as ordinary income on withdrawal, as opposed to tax-exempt (Roth, muni interest), which is never taxed. See §2 (prerequisite 5).", "calc": false, "source": "07-packaged-retirement-tax.md §2"}, {"id": "pkg-L1-04", "domain": "packaged", "level": 1, "topic": "annuity-lifetime-income", "module": "M30", "stem": "A 65-year-old retiree is worried about running out of money if she lives to 95. Which product is specifically designed to address that concern by paying her an income for as long as she lives?", "options": ["A life annuity purchased from an insurance company", "A 30-year corporate bond", "A money market fund with check-writing privileges", "A term life insurance policy"], "answer": 0, "explanation": "An annuity is an insurance contract that can be annuitized to pay income for the annuitant's lifetime; a bond stops at maturity, a money market fund can be exhausted, and term life pays only at death. See §3.5.", "calc": false, "source": "07-packaged-retirement-tax.md §3.5"}, {"id": "pkg-L1-05", "domain": "packaged", "level": 1, "topic": "index-fund-low-cost", "module": "M14", "stem": "Compared with an actively managed stock mutual fund, an index fund that simply tracks the S&P 500 would generally be expected to have:", "options": ["higher annual expenses, because it must buy all 500 stocks", "a guaranteed return equal to the index", "no risk of loss, because it is diversified", "lower annual expenses, because no manager is being paid to pick stocks"], "answer": 3, "explanation": "Index funds are passive, with low turnover and the lowest expense ratios; they still carry full market risk and only approximate the index after costs. See §3.2 (fund types; expense ratio).", "calc": false, "source": "07-packaged-retirement-tax.md §3.2"}, {"id": "pkg-L2-01", "domain": "packaged", "level": 2, "topic": "closed-end-fund-discount", "module": "M14", "stem": "A customer notices that shares of an investment company are quoted at $18.40 while the fund reports a net asset value of $20.00 per share. This fund is MOST likely:", "options": ["a closed-end fund whose shares trade on an exchange at a discount to NAV", "an open-end fund selling below NAV to attract new investors", "a no-load open-end fund", "a money market fund that has broken the buck"], "answer": 0, "explanation": "Open-end shares are always sold at POP (NAV plus any load) and redeemed at NAV, never below it; only a closed-end fund's market price is set by supply and demand and can sit at a premium or discount to NAV. See §3.3.", "calc": false, "source": "07-packaged-retirement-tax.md §3.3"}, {"id": "pkg-L2-02", "domain": "packaged", "level": 2, "topic": "variable-annuity-investment-risk", "module": "M30", "stem": "During the accumulation period of a variable annuity, the investment risk is borne by:", "options": ["the insurance company, which guarantees a minimum rate of return", "the contract owner, whose premiums are invested in a separate account", "the broker-dealer that sold the contract", "the state insurance guaranty fund"], "answer": 1, "explanation": "Variable annuity premiums go into a separate account whose value fluctuates, so the owner bears investment risk; in a fixed annuity the insurer's general account bears it and the owner bears purchasing-power risk. See §3.5.", "calc": false, "source": "07-packaged-retirement-tax.md §3.5"}, {"id": "pkg-L2-03", "domain": "packaged", "level": 2, "topic": "uit-structure", "module": "M29", "stem": "All of the following are characteristics of a unit investment trust EXCEPT:", "options": ["it has no board of directors", "its portfolio is fixed rather than actively traded", "units are redeemable through the sponsor", "it employs an investment adviser who manages the portfolio for an ongoing fee"], "answer": 3, "explanation": "A UIT is organized under a trust indenture with a fixed, unmanaged portfolio, redeemable units, and no board of directors or investment adviser (hence no management fee). See §3.1.", "calc": false, "source": "07-packaged-retirement-tax.md §3.1"}, {"id": "pkg-L2-04", "domain": "packaged", "level": 2, "topic": "gp-vs-lp-liability", "module": "M32", "stem": "A limited partner invests $25,000 in a real estate limited partnership. The partnership later defaults on $2 million it borrowed. The limited partner's maximum possible loss is:", "options": ["$25,000 plus a proportional share of the $2 million", "unlimited, the same as the general partner", "zero, because the general partner's fiduciary duty requires it to absorb losses", "$25,000, unless she personally signed for any of the partnership's debt"], "answer": 3, "explanation": "A limited partner's liability is limited to the amount invested plus any recourse debt she personally signed for; the general partner has unlimited personal liability. See §3.8 (Roles).", "calc": false, "source": "07-packaged-retirement-tax.md §3.8"}, {"id": "pkg-L2-05", "domain": "packaged", "level": 2, "topic": "roth-ira-no-rmd", "module": "M31", "stem": "Which of the following accounts does NOT require the original owner to take required minimum distributions during his or her lifetime?", "options": ["Traditional IRA", "SEP IRA", "Roth IRA", "403(b) plan"], "answer": 2, "explanation": "Roth IRA owners have no lifetime RMDs (beneficiaries do); traditional, SEP, and 403(b) accounts require RMDs beginning at age 73 (75 for those born 1960 or later). See §3.7 (Roth IRA).", "calc": false, "source": "07-packaged-retirement-tax.md §3.7"}, {"id": "pkg-L3-01", "domain": "packaged", "level": 3, "topic": "pop-from-nav-and-load", "module": "M29", "stem": "An open-end fund has a net asset value of $20.00 per share and a sales charge of 5%. The public offering price is:", "options": ["$19.00", "$21.00", "$21.50", "$21.05"], "answer": 3, "explanation": "The sales charge is a percentage of POP, so POP = NAV / (1 - 0.05) = $20.00 / 0.95 = $21.05. The planted error $20.00 x 1.05 = $21.00 treats the charge as a percentage of NAV. See §3.2.", "calc": true, "source": "07-packaged-retirement-tax.md §3.2"}, {"id": "pkg-L3-02", "domain": "packaged", "level": 3, "topic": "sales-charge-percent-of-pop", "module": "M29", "stem": "A mutual fund's public offering price is $12.50 and its net asset value is $11.75. The sales charge percentage is:", "options": ["6.0%", "6.4%", "7.5%", "5.6%"], "answer": 0, "explanation": "Sales charge % = (POP - NAV) / POP = ($12.50 - $11.75) / $12.50 = $0.75 / $12.50 = 6.0%. Dividing by NAV instead ($0.75 / $11.75 = 6.4%) is the classic error. See §3.2.", "calc": true, "source": "07-packaged-retirement-tax.md §3.2"}, {"id": "pkg-L3-03", "domain": "packaged", "level": 3, "topic": "fund-redemption-7-days", "module": "M29", "stem": "Under the Investment Company Act of 1940, an open-end fund that receives a redemption request must pay the shareholder within:", "options": ["3 business days", "7 calendar days", "7 business days", "30 days"], "answer": 1, "explanation": "ICA §22(e) requires payment within 7 calendar days at the next-computed NAV; 7 business days is the Rule 2330 principal-review window for variable annuities, a different rule. See §3.1 (§22) and §3.2 (Redemption).", "calc": false, "source": "07-packaged-retirement-tax.md §3.2"}, {"id": "pkg-L3-04", "domain": "packaged", "level": 3, "topic": "letter-of-intent-terms", "module": "M29", "stem": "A customer signs a letter of intent to qualify for a fund's $50,000 breakpoint. Which of the following statements about the letter of intent is TRUE?", "options": ["The customer has 13 months to complete the purchases, and the letter may be backdated up to 90 days to include a prior purchase", "The customer has 12 months to complete the purchases, and appreciation on the shares counts toward the total", "The letter is a binding contract, and failing to complete it results in a fine", "The customer must complete all purchases within 90 days of signing"], "answer": 0, "explanation": "An LOI is a non-binding pledge to reach the breakpoint within 13 months; it may be backdated up to 90 days (the 13 months run from the backdated date), only new money counts, and shares are held in escrow to cover the higher charge if it is not completed. See §3.2 (Letter of intent).", "calc": false, "source": "07-packaged-retirement-tax.md §3.2"}, {"id": "pkg-L3-05", "domain": "packaged", "level": 3, "topic": "subchapter-m-90-percent", "module": "M29", "stem": "To qualify as a regulated investment company under Subchapter M and avoid paying tax on income it distributes, a mutual fund must distribute at least what percentage of its net investment income to shareholders?", "options": ["50%", "75%", "90%", "100%"], "answer": 2, "explanation": "Under the conduit (pipeline) theory, a fund distributing at least 90% of net investment income is taxed only on what it retains; 75% is the REIT asset/income test, a different threshold. See §3.2 (Taxation of mutual funds).", "calc": false, "source": "07-packaged-retirement-tax.md §3.2"}, {"id": "pkg-L4-01", "domain": "packaged", "level": 4, "topic": "breakpoint-with-rights-of-accumulation", "module": "M29", "stem": "A customer owns Class A shares of the XYZ Growth Fund currently worth $40,000 (original cost $32,000). The fund's breakpoint schedule is: under $50,000, 5.75%; $50,000 to $99,999, 4.50%; $100,000 and above, 3.50%. The customer invests an additional $15,000 under rights of accumulation. The sales charge on the new purchase is:", "options": ["$862.50", "$675.00", "$2,475.00", "$525.00"], "answer": 1, "explanation": "ROA values existing holdings at the higher of cost or current value ($40,000); $40,000 + $15,000 = $55,000 crosses the $50,000 tier, so the new $15,000 pays 4.50%: $15,000 x 0.045 = $675. No retroactive refund applies to the old shares ($2,475 wrongly charges 4.50% on all $55,000; $862.50 ignores ROA). See §3.2 (Rights of accumulation).", "calc": true, "source": "07-packaged-retirement-tax.md §3.2"}, {"id": "pkg-L4-02", "domain": "packaged", "level": 4, "topic": "dollar-cost-averaging-average-cost", "module": "M29", "stem": "An investor buys $600 of a mutual fund on the first of each month for four months at prices of $12, $10, $8, and $10 per share. The investor's average cost per share is closest to:", "options": ["$9.80", "$10.00", "$9.50", "$10.20"], "answer": 0, "explanation": "Shares bought: 600/12 = 50, 600/10 = 60, 600/8 = 75, 600/10 = 60, total 245 shares for $2,400; average cost = $2,400 / 245 = $9.80. The average price, (12 + 10 + 8 + 10) / 4 = $10.00, is higher, which is the DCA effect. See §3.2 (Dollar-cost averaging).", "calc": true, "source": "07-packaged-retirement-tax.md §3.2"}, {"id": "pkg-L4-03", "domain": "packaged", "level": 4, "topic": "gifted-stock-dual-basis-loss", "module": "M33", "stem": "A father gives his daughter 100 shares of stock he purchased for $50 per share. On the date of the gift the stock is trading at $30. Eight months later the daughter sells all 100 shares at $25. For tax purposes she reports:", "options": ["a $2,500 loss", "a $2,000 loss", "a $500 loss", "no gain or loss"], "answer": 2, "explanation": "When FMV at the gift date is below the donor's basis, a later loss is measured from the gift-date FMV: ($30 - $25) x 100 = $500 loss (the donor's $50 basis would apply only to a gain; a sale between $30 and $50 produces neither). Because her basis here is the gift-date FMV rather than the donor's basis, the donor's holding period does NOT tack on (IRS Pub 550): her holding period starts at the gift, so the eight-month loss is short-term. The donor's holding period carries over only when his basis is used. See §3.10 (Gifted securities).", "calc": true, "source": "07-packaged-retirement-tax.md §3.10"}, {"id": "pkg-L4-04", "domain": "packaged", "level": 4, "topic": "air-payment-direction", "module": "M30", "stem": "A variable annuity is annuitized with an assumed interest rate (AIR) of 4%. The separate account earns 8% in month 1, 5% in month 2, and 3% in month 3. The third payment, which reflects the month 2 return, compared with the second payment will be:", "options": ["lower, because 5% is less than the 8% earned the previous month", "unchanged, because the AIR is a guaranteed rate", "lower, because annuity payments decline whenever the account's return falls", "higher, because 5% exceeds the 4% AIR"], "answer": 3, "explanation": "Each payment is compared with the AIR, never with the prior period's actual return: 5% > 4% AIR, so the third payment rises even though 5% < 8%. (The 3% month 3 return, below the AIR, would make the fourth payment fall.) See §3.5 (Annuitization and the AIR).", "calc": false, "source": "07-packaged-retirement-tax.md §3.5"}, {"id": "pkg-L4-05", "domain": "packaged", "level": 4, "topic": "indirect-rollover-20-percent-withholding", "module": "M31", "stem": "A 45-year-old leaves her employer and asks that her $100,000 401(k) balance be paid directly to her. She receives a check for $80,000 and, within 60 days, deposits that $80,000 into a rollover IRA. The tax result is:", "options": ["No tax is due; the $20,000 withheld is refunded in full when she files her return", "The entire $100,000 is taxable because only a direct trustee-to-trustee transfer avoids tax", "$20,000 is taxable as ordinary income and is subject to a 10% early-withdrawal penalty", "$20,000 is taxable as ordinary income, but no penalty applies because the plan withheld it"], "answer": 2, "explanation": "A plan distribution paid to the participant carries mandatory 20% withholding ($20,000); to roll over the full $100,000 she had to replace that $20,000 from other funds. The $20,000 not redeposited is a taxable distribution, and at 45 (no age-55 separation or other exception) it also incurs a 10% penalty of $2,000; the withholding is merely a credit against her total tax bill. See §3.7 (Rollovers vs transfers).", "calc": true, "source": "07-packaged-retirement-tax.md §3.7"}, {"id": "pkg-L5-01", "domain": "packaged", "level": 5, "topic": "annuity-units-fixed-number", "module": "M30", "stem": "Once a variable annuity contract is annuitized under a life payout option, which of the following remains FIXED for the life of the payout?", "options": ["The number of annuity units", "The value of each annuity unit", "The number of accumulation units", "The monthly dollar payment"], "answer": 0, "explanation": "At annuitization the accumulation units are converted into a fixed number of annuity units; each payment equals that fixed number times the current (fluctuating) annuity unit value, so the dollar payment varies. Accumulation units cease to exist once the contract is annuitized. See §3.5 (Annuitization).", "calc": false, "source": "07-packaged-retirement-tax.md §3.5"}, {"id": "pkg-L5-02", "domain": "packaged", "level": 5, "topic": "lifo-annuity-withdrawal-with-penalty", "module": "M30", "stem": "A 50-year-old contributed $50,000 to a non-qualified variable annuity that is now worth $80,000. He takes a lump-sum withdrawal of $20,000 without annuitizing. The tax consequence is:", "options": ["Nothing is taxable, because the first $50,000 withdrawn is a return of his after-tax contributions", "$20,000 is taxed as ordinary income and a $2,000 penalty applies", "$7,500 is taxed as ordinary income under the exclusion ratio, plus a $750 penalty", "$20,000 is taxed as a long-term capital gain with no penalty"], "answer": 1, "explanation": "Random withdrawals from a non-qualified annuity are LIFO: the $30,000 of earnings comes out first, so the entire $20,000 is ordinary income, and because he is under 59 1/2 a 10% penalty of $2,000 applies. FIFO treatment belongs to life insurance, and the exclusion ratio applies only to annuitized payments. See §3.5 (Taxation).", "calc": true, "source": "07-packaged-retirement-tax.md §3.5"}, {"id": "pkg-L5-03", "domain": "packaged", "level": 5, "topic": "inherited-basis-always-long-term", "module": "M33", "stem": "A man bought 100 shares of ABC at $20 per share and died two months later, when ABC was trading at $100. His daughter inherited the shares and sold them one month after his death at $110. She reports:", "options": ["a short-term capital gain of $9,000", "a short-term capital gain of $1,000", "a long-term capital gain of $9,000", "a long-term capital gain of $1,000"], "answer": 3, "explanation": "Inherited securities take a stepped-up basis equal to FMV at the date of death ($100) and are always treated as long-term regardless of how long the decedent or heir held them: ($110 - $100) x 100 = $1,000 long-term gain. See §3.10 (Inherited securities).", "calc": true, "source": "07-packaged-retirement-tax.md §3.10"}, {"id": "pkg-L5-04", "domain": "packaged", "level": 5, "topic": "wash-sale-substantially-identical-except", "module": "M33", "stem": "A customer sells 500 shares of XYZ common stock at a loss on June 1. All of the following purchases made on June 15 would cause the loss to be disallowed under the wash-sale rule EXCEPT:", "options": ["XYZ call options", "XYZ convertible bonds", "common stock of XYZ's largest competitor in the same industry", "XYZ common stock purchased in the customer's IRA"], "answer": 2, "explanation": "Within the 30-day window, calls, rights, warrants, and convertibles on the same stock are substantially identical, and a repurchase inside an IRA disallows the loss permanently (Rev. Rul. 2008-5). A different company's stock, even in the same industry, is not substantially identical. See §3.10 (Wash-sale rule).", "calc": false, "source": "07-packaged-retirement-tax.md §3.10"}, {"id": "pkg-L5-05", "domain": "packaged", "level": 5, "topic": "passive-loss-offset-limit", "module": "M32", "stem": "An investor has a $150,000 salary, $5,000 of dividend income, and $4,000 of income from a real estate limited partnership. This year she is allocated a $10,000 loss from an oil and gas drilling program. The amount of that loss she may deduct this year is:", "options": ["$10,000", "$4,000", "$9,000", "$0"], "answer": 1, "explanation": "DPP losses are passive and may offset only passive income, not wages (active) or dividends (portfolio): $4,000 from the other partnership is deductible and the remaining $6,000 is suspended and carried forward until she has passive income or disposes of the interest. See §3.8 (Passive activity rules).", "calc": true, "source": "07-packaged-retirement-tax.md §3.8"}, {"id": "reg-L1-01", "domain": "regulation", "level": 1, "topic": "what-an-ipo-is", "module": "M37", "stem": "A private company announces it will \"go public\" through an initial public offering (IPO). What happens in an IPO?", "options": ["The company's founders sell their shares to one another at a fixed price", "Existing shareholders trade shares among themselves on a stock exchange", "The company sells shares to the public for the first time and receives the proceeds", "The government buys shares to guarantee the company's success"], "answer": 2, "explanation": "An IPO is the first public sale of a company's shares; it is a primary-market transaction, so the issuer (not existing holders) receives the money. Later trading between investors is the secondary market.", "calc": false, "source": "09-regulation-trading-economics.md §2, §3.2"}, {"id": "reg-L1-02", "domain": "regulation", "level": 1, "topic": "why-insider-trading-is-illegal", "module": "M38", "stem": "A company executive learns that her company will announce a large, unexpected loss next week. She sells all of her shares before the news is released. Why is this illegal?", "options": ["She traded on material nonpublic information, gaining an unfair advantage over other investors", "Executives are never allowed to sell shares of the company they work for", "Selling stock in the week before any earnings announcement is prohibited for all investors", "She failed to pay a special transaction tax that applies to executives"], "answer": 0, "explanation": "Insider trading law targets trading on material nonpublic information (MNPI) in breach of a duty; insiders may sell, but only when the market has the same information. Penalties reach treble the profit made or loss avoided (civil) plus criminal exposure.", "calc": false, "source": "09-regulation-trading-economics.md §3.3 Insider trading"}, {"id": "reg-L1-03", "domain": "regulation", "level": 1, "topic": "what-a-limit-means", "module": "M38", "stem": "An investor tells her broker to buy 100 shares of a stock \"with a limit of $25.\" What does this instruction mean?", "options": ["The order executes immediately at whatever price is currently available", "She will pay no more than $25 per share, and the order may never execute if the price stays above $25", "She must buy at least $25 worth of the stock", "The broker will automatically sell the shares if they later fall to $25"], "answer": 1, "explanation": "A limit order executes only at the limit price or better; it guarantees price but not execution. A market order is the one that guarantees execution but not price.", "calc": false, "source": "09-regulation-trading-economics.md §3.8"}, {"id": "reg-L1-04", "domain": "regulation", "level": 1, "topic": "why-audited-financials", "module": "M6", "stem": "Why are publicly traded companies required to file audited financial statements with the SEC every year?", "options": ["So the SEC can decide whether the stock is a good investment", "So the stock exchange can set the stock's trading price", "So the company can avoid paying corporate income tax", "So investors can rely on independently verified information when making decisions"], "answer": 3, "explanation": "The securities laws are built on full and fair disclosure, not merit review: the SEC never approves a security or judges its quality. The 1934 Act's annual 10-K must contain audited financials so investors can make informed decisions.", "calc": false, "source": "09-regulation-trading-economics.md §3.1 (purpose), §3.3 Issuer reporting"}, {"id": "reg-L1-05", "domain": "regulation", "level": 1, "topic": "bid-vs-ask-which-price-customer-pays", "module": "M38", "stem": "A dealer quotes a stock at 10.50 bid, 10.55 ask. A customer who wants to buy 100 shares from this dealer would pay approximately:", "options": ["$10.50 per share", "$10.55 per share", "$10.525 per share, the midpoint of the quote", "Whatever the customer offers, because the dealer must accept any bid"], "answer": 1, "explanation": "The bid is the price the dealer will pay and the ask (offer) is the price the dealer will sell at, so a customer buys at the ask and sells at the bid. The spread (ask minus bid) is the dealer's compensation.", "calc": false, "source": "09-regulation-trading-economics.md §2, §3.7"}, {"id": "reg-L2-01", "domain": "regulation", "level": 2, "topic": "securities-act-1933-scope", "module": "M6", "stem": "The Securities Act of 1933 primarily regulates which of the following?", "options": ["The issuance of new securities to the public, requiring registration and delivery of a prospectus", "Secondary-market trading of securities on exchanges and over the counter", "Persons who give investment advice for compensation", "Margin requirements set by the Federal Reserve Board"], "answer": 0, "explanation": "The 1933 Act (the \"Paper Act\") covers new issues: registration statements, the prospectus, and anti-fraud in offerings. The 1934 Act (the \"People Act\") governs the secondary market, created the SEC, and gave the Fed margin authority.", "calc": false, "source": "09-regulation-trading-economics.md §3.1, §3.3"}, {"id": "reg-L2-02", "domain": "regulation", "level": 2, "topic": "firm-commitment-vs-best-efforts", "module": "M37", "stem": "In which type of underwriting does the underwriter purchase the entire issue from the issuer as principal and bear the risk of any unsold shares?", "options": ["Best efforts", "All-or-none", "Mini-max", "Firm commitment"], "answer": 3, "explanation": "In a firm commitment the underwriter buys the securities from the issuer and resells them, taking the inventory risk. Best-efforts variants (including all-or-none and mini-max) are agency arrangements in which unsold securities are returned to the issuer.", "calc": false, "source": "09-regulation-trading-economics.md §3.2 Types of commitment"}, {"id": "reg-L2-03", "domain": "regulation", "level": 2, "topic": "regular-way-settlement-t-plus-1", "module": "M38", "stem": "Regular-way settlement of a corporate stock transaction occurs:", "options": ["On the same business day as the trade", "Two business days after the trade date", "One business day after the trade date", "Three business days after the trade date"], "answer": 2, "explanation": "Under SEA Rule 15c6-1 as amended, regular way for stocks, corporate and municipal bonds, ETFs and mutual funds has been T+1 since May 28, 2024 (it was T+2 before). Same-day settlement is a cash trade; T+3 is now the Reg T payment date, not settlement.", "calc": false, "source": "09-regulation-trading-economics.md §3.11 Settlement cycles"}, {"id": "reg-L2-04", "domain": "regulation", "level": 2, "topic": "ioc-vs-fok-vs-aon", "module": "M38", "stem": "Which order qualifier requires that the order be executed immediately, in whole or in part, with any unfilled portion canceled?", "options": ["Fill-or-kill", "Immediate-or-cancel", "All-or-none", "Good-till-canceled"], "answer": 1, "explanation": "IOC = now, partial fill allowed; FOK = now and the entire order or nothing; AON = the entire order but it may wait. This three-way distinction is a standard exam item.", "calc": false, "source": "09-regulation-trading-economics.md §3.8 Time-in-force / qualifiers"}, {"id": "reg-L2-05", "domain": "regulation", "level": 2, "topic": "red-herring-contents", "module": "M37", "stem": "A preliminary prospectus (red herring) distributed during the cooling-off period typically OMITS which of the following?", "options": ["The final public offering price and the effective date", "A description of the issuer's business", "The risk factors of the offering", "The intended use of the proceeds"], "answer": 0, "explanation": "Under Rule 430 the red herring contains most of the registration-statement disclosure but leaves out the final POP and effective date (a price range may be shown). It carries a red legend and may not be marked up or used to solicit money.", "calc": false, "source": "09-regulation-trading-economics.md §3.1.1 Cooling-off period"}, {"id": "reg-L3-01", "domain": "regulation", "level": 3, "topic": "aftermarket-prospectus-delivery-period", "module": "M37", "stem": "A broker-dealer sells shares in the aftermarket of an initial public offering of a company whose stock will be listed on Nasdaq. For how long after the effective date must the dealer deliver a prospectus to aftermarket purchasers?", "options": ["90 days", "40 days", "25 days", "No delivery requirement applies once the offering is effective"], "answer": 2, "explanation": "Aftermarket delivery under Rule 174 / Rule 15c2-8 is 90 days for a non-listed IPO, 40 days for a non-listed follow-on, 25 days for an IPO that will be exchange- or Nasdaq-listed, and 0 days for a listed follow-on.", "calc": false, "source": "09-regulation-trading-economics.md §3.1.1 Aftermarket prospectus delivery"}, {"id": "reg-L3-02", "domain": "regulation", "level": 3, "topic": "accredited-investor-test", "module": "M37", "stem": "A married couple wants to invest in a Rule 506(b) private placement. Each spouse earned $130,000 in each of the past two years ($260,000 jointly) and expects the same this year. Their net worth is $1,400,000, of which $600,000 is the equity in their primary residence. Neither holds a securities license. For Regulation D purposes the couple is:", "options": ["Accredited, because joint income exceeds $200,000", "Accredited, because net worth exceeds $1,000,000", "Accredited, because they satisfy both the income and the net-worth tests", "Not accredited under either the income test or the net-worth test"], "answer": 3, "explanation": "The joint income test is more than $300,000 (the $200,000 test is per individual, and neither spouse reaches it), and net worth must exceed $1,000,000 EXCLUDING the primary residence, which leaves only $800,000. The Series 7/65/82 route does not apply. Thresholds are unchanged as of 2026.", "calc": true, "source": "09-regulation-trading-economics.md §3.1.3 Accredited investor"}, {"id": "reg-L3-03", "domain": "regulation", "level": 3, "topic": "sell-stop-election-and-execution", "module": "M38", "stem": "A customer enters an order to sell 100 XYZ
